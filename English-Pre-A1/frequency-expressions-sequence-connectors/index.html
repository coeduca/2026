    {
      "type": "note",
      "title": "Frequency Expressions & Sequence Connectors",
      "html": "\n            <article style=\"font-family:Arial,sans-serif;color:#1A1A1A;line-height:1.6;font-size:15px;\">\n\n              <header style=\"background:#E381F7;border:3px solid #1A1A1A;border-radius:13px;box-shadow:5px 5px 0 #1A1A1A;padding:15px;margin-bottom:22px;text-align:center;\">\n                <h2 style=\"font-size:22px;line-height:1.25;margin:0;\">Frequency Expressions &amp; Sequence Connectors</h2>\n                <p style=\"font-size:13px;margin:7px 0 0;\">Expresiones de frecuencia y conectores de secuencia</p>\n              </header>\n\n              <section style=\"margin-bottom:21px;\">\n                <h3 style=\"font-size:19px;margin:0 0 10px;border-left:6px solid #43B069;padding-left:10px;\">1. Frequency Expressions</h3>\n\n                <p>We use frequency expressions to say <strong>how often</strong> or <strong>when</strong> we do something.</p>\n                <p style=\"font-size:13px;color:#555;margin-top:-6px;\">Usamos estas expresiones para indicar con qué frecuencia o cuándo realizamos una actividad.</p>\n\n                <div style=\"background:#F2FAF3;border:2px solid #43B069;border-radius:12px;padding:13px;margin:12px 0;\">\n                  <h4 style=\"font-size:16px;margin:0 0 9px;\">How often? — ¿Con qué frecuencia?</h4>\n                  <div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;font-size:13px;\">\n                    <div><strong>every day</strong><div>todos los días</div></div>\n                    <div><strong>every week</strong><div>todas las semanas</div></div>\n                    <div><strong>once a day</strong><div>una vez al día</div></div>\n                    <div><strong>twice a day</strong><div>dos veces al día</div></div>\n                    <div><strong>twice a week</strong><div>dos veces a la semana</div></div>\n                    <div><strong>three times a week</strong><div>tres veces a la semana</div></div>\n                  </div>\n                </div>\n\n                <div style=\"background:#F4E8FC;border:2px solid #E381F7;border-radius:12px;padding:13px;margin:12px 0;\">\n                  <h4 style=\"font-size:16px;margin:0 0 9px;\">When? — ¿Cuándo?</h4>\n                  <div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;font-size:13px;\">\n                    <div><strong>in the morning</strong><div>por la mañana</div></div>\n                    <div><strong>in the afternoon</strong><div>por la tarde</div></div>\n                    <div><strong>in the evening</strong><div>por la noche</div></div>\n                    <div><strong>at night</strong><div>por la noche</div></div>\n                    <div><strong>at noon</strong><div>al mediodía</div></div>\n                    <div><strong>on Monday morning</strong><div>el lunes por la mañana</div></div>\n                  </div>\n                </div>\n\n                <div style=\"background:#FFF3BF;border:2px solid #1A1A1A;border-radius:11px;padding:13px;margin-top:12px;\">\n                  <strong>Remember!</strong>\n                  <p style=\"margin:7px 0 0;font-size:13px;\">Usamos <strong>in</strong> con partes del día, <strong>at</strong> con momentos como noon y night, y <strong>on</strong> con días de la semana.</p>\n                  <p style=\"margin:8px 0 0;font-size:13px;\">Las expresiones de frecuencia normalmente van al final de la oración.</p>\n                </div>\n              </section>\n\n              <section style=\"margin-bottom:21px;\">\n                <h3 style=\"font-size:19px;margin:0 0 10px;border-left:6px solid #E381F7;padding-left:10px;\">2. Sequence Connectors</h3>\n\n                <p>We use sequence connectors to show <strong>the order</strong> in which things happen.</p>\n                <p style=\"font-size:13px;color:#555;margin-top:-6px;\">Los conectores de secuencia nos ayudan a organizar las acciones en orden.</p>\n\n                <div style=\"border:2px solid #1A1A1A;border-radius:12px;overflow:hidden;margin:12px 0;\">\n                  <div style=\"padding:9px 12px;background:#F7D6FF;\"><strong>First / First of all</strong> — Primero</div>\n                  <div style=\"padding:9px 12px;background:#FFFFFF;\"><strong>Then</strong> — Luego / Después</div>\n                  <div style=\"padding:9px 12px;background:#DDF5E4;\"><strong>Next</strong> — A continuación</div>\n                  <div style=\"padding:9px 12px;background:#FFFFFF;\"><strong>After that</strong> — Después de eso</div>\n                  <div style=\"padding:9px 12px;background:#F7D6FF;\"><strong>Later</strong> — Más tarde</div>\n                  <div style=\"padding:9px 12px;background:#FFFFFF;\"><strong>Finally</strong> — Finalmente</div>\n                </div>\n\n                <p style=\"font-size:13px;\">Los conectores pueden colocarse al inicio de la oración y normalmente van seguidos de una coma.</p>\n              </section>\n\n              <section>\n                <h3 style=\"font-size:19px;margin:0 0 10px;border-left:6px solid #43B069;padding-left:10px;\">3. Examples — Ejemplos</h3>\n\n                <div style=\"display:flex;flex-direction:column;gap:10px;\">\n\n                  <div style=\"border:2px solid #1A1A1A;border-radius:11px;background:#FFFFFF;padding:12px;\">\n                    <strong>I study English <span style=\"color:#15803D;\">every day.</span></strong>\n                    <div style=\"font-size:13px;margin-top:5px;\">Yo estudio inglés todos los días.</div>\n                  </div>\n\n                  <div style=\"border:2px solid #1A1A1A;border-radius:11px;background:#FFFFFF;padding:12px;\">\n                    <strong>I wash my hands <span style=\"color:#15803D;\">twice a day.</span></strong>\n                    <div style=\"font-size:13px;margin-top:5px;\">Me lavo las manos dos veces al día.</div>\n                  </div>\n\n                  <div style=\"border:2px solid #1A1A1A;border-radius:11px;background:#FFFFFF;padding:12px;\">\n                    <strong><span style=\"color:#9A29B5;\">First,</span> I wake up. <span style=\"color:#9A29B5;\">Then,</span> I take a shower. <span style=\"color:#9A29B5;\">Finally,</span> I go to school.</strong>\n                    <div style=\"font-size:13px;margin-top:5px;\">Primero me despierto. Luego me baño. Finalmente voy a la escuela.</div>\n                  </div>\n\n                </div>\n              </section>\n\n              <footer style=\"margin-top:18px;background:#FFE781;border:2px dashed #1A1A1A;border-radius:10px;padding:12px;text-align:center;font-size:13px;\">\n                <strong>Frequency = How often / When?</strong>\n                <div>Sequence = In what order?</div>\n              </footer>\n\n            </article>\n          "
    },
