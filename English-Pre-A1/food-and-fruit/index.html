      "type": "note",
      "title": "Food and Fruit - Study Guide",
      "instruction": "Lee y repasa el vocabulario y los ejemplos antes de comenzar el examen.",
      "html": "\n            <section style=\"font-family:Arial,sans-serif;color:#1A1A1A;line-height:1.6;max-width:100%;box-sizing:border-box;\">\n\n              <header style=\"background:#8800FF;color:#FFFFFF;border-radius:14px;padding:20px 16px;text-align:center;margin-bottom:16px;\">\n                <div style=\"font-size:32px;margin-bottom:6px;\">🍎 🍕 🍇</div>\n                <h2 style=\"font-size:24px;line-height:1.2;margin:0 0 8px;\">FOOD &amp; FRUIT</h2>\n                <p style=\"font-size:14px;margin:0;\">English Vocabulary • Seventh Grade</p>\n              </header>\n\n              <section style=\"background:#F7BDFF;border-radius:12px;padding:15px;margin-bottom:14px;\">\n                <h3 style=\"font-size:18px;margin:0 0 8px;color:#570099;\">🍽️ What is food?</h3>\n                <p style=\"margin:0 0 8px;\">\n                  <strong>Food</strong> significa comida o alimento. Usamos esta palabra para hablar de lo que comemos.\n                </p>\n                <p style=\"margin:0;\">\n                  <strong>Fruit</strong> significa fruta. Las frutas son un tipo de alimento.\n                </p>\n              </section>\n\n              <section style=\"background:#C9DBE9;border-radius:12px;padding:15px;margin-bottom:14px;\">\n                <h3 style=\"font-size:18px;margin:0 0 10px;color:#570099;\">🍓 Fruit Vocabulary</h3>\n                <div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;font-size:14px;\">\n                  <div>🍎 <strong>Apple</strong> — Manzana</div>\n                  <div>🍌 <strong>Banana</strong> — Plátano</div>\n                  <div>🍇 <strong>Grapes</strong> — Uvas</div>\n                  <div>🍊 <strong>Orange</strong> — Naranja</div>\n                  <div>🍓 <strong>Strawberry</strong> — Fresa</div>\n                  <div>🍉 <strong>Watermelon</strong> — Sandía</div>\n                  <div>🍍 <strong>Pineapple</strong> — Piña</div>\n                  <div>🥭 <strong>Mango</strong> — Mango</div>\n                  <div>🍐 <strong>Pear</strong> — Pera</div>\n                  <div>🍋 <strong>Lemon</strong> — Limón</div>\n                </div>\n              </section>\n\n              <section style=\"background:#FFF0B8;border-radius:12px;padding:15px;margin-bottom:14px;\">\n                <h3 style=\"font-size:18px;margin:0 0 10px;color:#570099;\">🍔 Other Food Vocabulary</h3>\n                <div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;font-size:14px;\">\n                  <div>🍕 <strong>Pizza</strong> — Pizza</div>\n                  <div>🍔 <strong>Hamburger</strong> — Hamburguesa</div>\n                  <div>🍗 <strong>Chicken</strong> — Pollo</div>\n                  <div>🐟 <strong>Fish</strong> — Pescado</div>\n                  <div>🍚 <strong>Rice</strong> — Arroz</div>\n                  <div>🍞 <strong>Bread</strong> — Pan</div>\n                  <div>🧀 <strong>Cheese</strong> — Queso</div>\n                  <div>🥗 <strong>Salad</strong> — Ensalada</div>\n                  <div>🍝 <strong>Pasta</strong> — Pasta</div>\n                  <div>🥪 <strong>Sandwich</strong> — Sándwich</div>\n                </div>\n              </section>\n\n              <section style=\"background:#F7BDFF;border-radius:12px;padding:15px;margin-bottom:14px;\">\n                <h3 style=\"font-size:18px;margin:0 0 10px;color:#570099;\">❤️ Talking About Likes</h3>\n                <p style=\"margin:0 0 10px;\">\n                  Usamos <strong>like</strong> para expresar lo que nos gusta.\n                </p>\n\n                <div style=\"background:#FFFFFF;padding:11px;border-radius:9px;margin-bottom:8px;\">\n                  <strong>I like bananas.</strong>\n                  <div style=\"font-size:13px;color:#555555;\">Me gustan los plátanos.</div>\n                </div>\n\n                <div style=\"background:#FFFFFF;padding:11px;border-radius:9px;margin-bottom:8px;\">\n                  <strong>She likes pizza.</strong>\n                  <div style=\"font-size:13px;color:#555555;\">A ella le gusta la pizza.</div>\n                </div>\n\n                <div style=\"background:#FFFFFF;padding:11px;border-radius:9px;\">\n                  <strong>Do you like grapes? Yes, I do.</strong>\n                  <div style=\"font-size:13px;color:#555555;\">¿Te gustan las uvas? Sí.</div>\n                </div>\n\n                <p style=\"font-size:13px;margin:12px 0 0;\">\n                  Recuerda: con <strong>he, she, it</strong> usamos <strong>likes</strong> en afirmaciones. En preguntas usamos <strong>Do</strong> o <strong>Does</strong>. Después de <strong>does</strong> o <strong>does not</strong>, usamos <strong>like</strong>, sin -s.\n                </p>\n              </section>\n\n              <footer style=\"background:#8800FF;color:#FFFFFF;border-radius:12px;padding:13px;text-align:center;\">\n                <strong>🌟 Ready for your exam?</strong>\n                <p style=\"font-size:13px;margin:5px 0 0;\">Read carefully, think and choose your answers!</p>\n              </footer>\n\n            </section>\n          "
