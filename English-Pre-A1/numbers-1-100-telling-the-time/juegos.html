      "title": "📚 Learn! Numbers & Telling the Time",
      "instruction": "Lee la explicación y estudia los ejemplos antes de comenzar los ejercicios.",
      "html": "\n            \u003ch2>🔢 NUMBERS 1–100\u003c/h2>\n\n            \u003cp>En inglés, los números se utilizan para contar objetos, expresar cantidades y decir la hora.\u003c/p>\n\n            \u003cp>\u003cstrong>Number\u003c/strong> significa número y \u003cstrong>Time\u003c/strong> significa tiempo u hora.\u003c/p>\n\n            \u003ch3>Numbers from 1 to 20\u003c/h3>\n\n            \u003ctable>\n              \u003cthead>\n                \u003ctr>\n                  \u003cth>Number\u003c/th>\n                  \u003cth>English\u003c/th>\n                \u003c/tr>\n              \u003c/thead>\n              \u003ctbody>\n                \u003ctr>\u003ctd>1\u003c/td>\u003ctd>One\u003c/td>\u003c/tr>\n                \u003ctr>\u003ctd>2\u003c/td>\u003ctd>Two\u003c/td>\u003c/tr>\n                \u003ctr>\u003ctd>3\u003c/td>\u003ctd>Three\u003c/td>\u003c/tr>\n                \u003ctr>\u003ctd>4\u003c/td>\u003ctd>Four\u003c/td>\u003c/tr>\n                \u003ctr>\u003ctd>5\u003c/td>\u003ctd>Five\u003c/td>\u003c/tr>\n                \u003ctr>\u003ctd>6\u003c/td>\u003ctd>Six\u003c/td>\u003c/tr>\n                \u003ctr>\u003ctd>7\u003c/td>\u003ctd>Seven\u003c/td>\u003c/tr>\n                \u003ctr>\u003ctd>8\u003c/td>\u003ctd>Eight\u003c/td>\u003c/tr>\n                \u003ctr>\u003ctd>9\u003c/td>\u003ctd>Nine\u003c/td>\u003c/tr>\n                \u003ctr>\u003ctd>10\u003c/td>\u003ctd>Ten\u003c/td>\u003c/tr>\n                \u003ctr>\u003ctd>11\u003c/td>\u003ctd>Eleven\u003c/td>\u003c/tr>\n                \u003ctr>\u003ctd>12\u003c/td>\u003ctd>Twelve\u003c/td>\u003c/tr>\n                \u003ctr>\u003ctd>13\u003c/td>\u003ctd>Thirteen\u003c/td>\u003c/tr>\n                \u003ctr>\u003ctd>14\u003c/td>\u003ctd>Fourteen\u003c/td>\u003c/tr>\n                \u003ctr>\u003ctd>15\u003c/td>\u003ctd>Fifteen\u003c/td>\u003c/tr>\n                \u003ctr>\u003ctd>16\u003c/td>\u003ctd>Sixteen\u003c/td>\u003c/tr>\n                \u003ctr>\u003ctd>17\u003c/td>\u003ctd>Seventeen\u003c/td>\u003c/tr>\n                \u003ctr>\u003ctd>18\u003c/td>\u003ctd>Eighteen\u003c/td>\u003c/tr>\n                \u003ctr>\u003ctd>19\u003c/td>\u003ctd>Nineteen\u003c/td>\u003c/tr>\n                \u003ctr>\u003ctd>20\u003c/td>\u003ctd>Twenty\u003c/td>\u003c/tr>\n              \u003c/tbody>\n            \u003c/table>\n\n            \u003ch3>Numbers from 30 to 100\u003c/h3>\n\n            \u003ctable>\n              \u003cthead>\n                \u003ctr>\n                  \u003cth>Number\u003c/th>\n                  \u003cth>English\u003c/th>\n                \u003c/tr>\n              \u003c/thead>\n              \u003ctbody>\n                \u003ctr>\u003ctd>30\u003c/td>\u003ctd>Thirty\u003c/td>\u003c/tr>\n                \u003ctr>\u003ctd>40\u003c/td>\u003ctd>Forty\u003c/td>\u003c/tr>\n                \u003ctr>\u003ctd>50\u003c/td>\u003ctd>Fifty\u003c/td>\u003c/tr>\n                \u003ctr>\u003ctd>60\u003c/td>\u003ctd>Sixty\u003c/td>\u003c/tr>\n                \u003ctr>\u003ctd>70\u003c/td>\u003ctd>Seventy\u003c/td>\u003c/tr>\n                \u003ctr>\u003ctd>80\u003c/td>\u003ctd>Eighty\u003c/td>\u003c/tr>\n                \u003ctr>\u003ctd>90\u003c/td>\u003ctd>Ninety\u003c/td>\u003c/tr>\n                \u003ctr>\u003ctd>100\u003c/td>\u003ctd>One hundred\u003c/td>\u003c/tr>\n              \u003c/tbody>\n            \u003c/table>\n\n            \u003ch3>💡 How to form numbers\u003c/h3>\n\n            \u003cp>Para formar números del 21 al 99 que no son decenas exactas, combinamos las decenas con las unidades utilizando un guion.\u003c/p>\n\n            \u003cp>\u003cstrong>Examples:\u003c/strong>\u003c/p>\n\n            \u003cul>\n              \u003cli>21 → Twenty-one\u003c/li>\n              \u003cli>32 → Thirty-two\u003c/li>\n              \u003cli>45 → Forty-five\u003c/li>\n              \u003cli>58 → Fifty-eight\u003c/li>\n              \u003cli>67 → Sixty-seven\u003c/li>\n              \u003cli>79 → Seventy-nine\u003c/li>\n              \u003cli>84 → Eighty-four\u003c/li>\n              \u003cli>96 → Ninety-six\u003c/li>\n            \u003c/ul>\n\n            \u003cp>\u003cstrong>Remember!\u003c/strong> Se escribe \u003cstrong>forty\u003c/strong>, no fourty; y \u003cstrong>fifteen\u003c/strong>, no fiveteen.\u003c/p>\n\n            \u003chr>\n\n            \u003ch2>🕒 TELLING THE TIME\u003c/h2>\n\n            \u003cp>Para preguntar la hora en inglés utilizamos:\u003c/p>\n\n            \u003cp>\u003cstrong>What time is it?\u003c/strong> — ¿Qué hora es?\u003c/p>\n\n            \u003cp>Para responder comenzamos con:\u003c/p>\n\n            \u003cp>\u003cstrong>It's...\u003c/strong> — Son las... / Es la...\u003c/p>\n\n            \u003ch3>1. O'clock — En punto\u003c/h3>\n\n            \u003cp>Utilizamos \u003cstrong>o'clock\u003c/strong> cuando el reloj marca una hora exacta.\u003c/p>\n\n            \u003cul>\n              \u003cli>1:00 → It's one o'clock.\u003c/li>\n              \u003cli>3:00 → It's three o'clock.\u003c/li>\n              \u003cli>6:00 → It's six o'clock.\u003c/li>\n              \u003cli>10:00 → It's ten o'clock.\u003c/li>\n            \u003c/ul>\n\n            \u003ch3>2. Half past — Y media\u003c/h3>\n\n            \u003cp>Utilizamos \u003cstrong>half past\u003c/strong> cuando han pasado 30 minutos de una hora.\u003c/p>\n\n            \u003cul>\n              \u003cli>2:30 → It's half past two.\u003c/li>\n              \u003cli>4:30 → It's half past four.\u003c/li>\n              \u003cli>7:30 → It's half past seven.\u003c/li>\n              \u003cli>9:30 → It's half past nine.\u003c/li>\n            \u003c/ul>\n\n            \u003ch3>3. Quarter past — Y cuarto\u003c/h3>\n\n            \u003cp>Utilizamos \u003cstrong>a quarter past\u003c/strong> cuando han pasado 15 minutos de una hora.\u003c/p>\n\n            \u003cul>\n              \u003cli>1:15 → It's a quarter past one.\u003c/li>\n              \u003cli>3:15 → It's a quarter past three.\u003c/li>\n              \u003cli>8:15 → It's a quarter past eight.\u003c/li>\n            \u003c/ul>\n\n            \u003ch3>4. Quarter to — Cuarto para\u003c/h3>\n\n            \u003cp>Utilizamos \u003cstrong>a quarter to\u003c/strong> cuando faltan 15 minutos para la siguiente hora.\u003c/p>\n\n            \u003cul>\n              \u003cli>2:45 → It's a quarter to three.\u003c/li>\n              \u003cli>5:45 → It's a quarter to six.\u003c/li>\n              \u003cli>10:45 → It's a quarter to eleven.\u003c/li>\n            \u003c/ul>\n\n            \u003ch3>5. Digital Time\u003c/h3>\n\n            \u003cp>También podemos expresar la hora leyendo directamente los números del reloj digital.\u003c/p>\n\n            \u003cul>\n              \u003cli>3:10 → It's three ten.\u003c/li>\n              \u003cli>4:20 → It's four twenty.\u003c/li>\n              \u003cli>6:30 → It's six thirty.\u003c/li>\n              \u003cli>8:45 → It's eight forty-five.\u003c/li>\n            \u003c/ul>\n\n            \u003ch3>⭐ Quick Review\u003c/h3>\n\n            \u003ctable>\n              \u003cthead>\n                \u003ctr>\n                  \u003cth>Time\u003c/th>\n                  \u003cth>Expression\u003c/th>\n                \u003c/tr>\n              \u003c/thead>\n              \u003ctbody>\n                \u003ctr>\u003ctd>5:00\u003c/td>\u003ctd>Five o'clock\u003c/td>\u003c/tr>\n                \u003ctr>\u003ctd>5:15\u003c/td>\u003ctd>A quarter past five\u003c/td>\u003c/tr>\n                \u003ctr>\u003ctd>5:30\u003c/td>\u003ctd>Half past five\u003c/td>\u003c/tr>\n                \u003ctr>\u003ctd>5:45\u003c/td>\u003ctd>A quarter to six\u003c/td>\u003c/tr>\n              \u003c/tbody>\n            \u003c/table>\n\n            \u003cp>\u003cstrong>🎯 Your turn!\u003c/strong> Practica los números y las horas en las actividades siguientes.\u003c/p>\n          "
