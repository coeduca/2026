      "instruction": "Lee la explicación y estudia los ejemplos antes de comenzar los ejercicios.",
      "html": "\n            <h2>🔢 NUMBERS 1–100</h2>\n\n            <p>En inglés, los números se utilizan para contar objetos, expresar cantidades y decir la hora.</p>\n\n            <p><strong>Number</strong> significa número y <strong>Time</strong> significa tiempo u hora.</p>\n\n            <h3>Numbers from 1 to 20</h3>\n\n            <table>\n              <thead>\n                <tr>\n                  <th>Number</th>\n                  <th>English</th>\n                </tr>\n              </thead>\n              <tbody>\n                <tr><td>1</td><td>One</td></tr>\n                <tr><td>2</td><td>Two</td></tr>\n                <tr><td>3</td><td>Three</td></tr>\n                <tr><td>4</td><td>Four</td></tr>\n                <tr><td>5</td><td>Five</td></tr>\n                <tr><td>6</td><td>Six</td></tr>\n                <tr><td>7</td><td>Seven</td></tr>\n                <tr><td>8</td><td>Eight</td></tr>\n                <tr><td>9</td><td>Nine</td></tr>\n                <tr><td>10</td><td>Ten</td></tr>\n                <tr><td>11</td><td>Eleven</td></tr>\n                <tr><td>12</td><td>Twelve</td></tr>\n                <tr><td>13</td><td>Thirteen</td></tr>\n                <tr><td>14</td><td>Fourteen</td></tr>\n                <tr><td>15</td><td>Fifteen</td></tr>\n                <tr><td>16</td><td>Sixteen</td></tr>\n                <tr><td>17</td><td>Seventeen</td></tr>\n                <tr><td>18</td><td>Eighteen</td></tr>\n                <tr><td>19</td><td>Nineteen</td></tr>\n                <tr><td>20</td><td>Twenty</td></tr>\n              </tbody>\n            </table>\n\n            <h3>Numbers from 30 to 100</h3>\n\n            <table>\n              <thead>\n                <tr>\n                  <th>Number</th>\n                  <th>English</th>\n                </tr>\n              </thead>\n              <tbody>\n                <tr><td>30</td><td>Thirty</td></tr>\n                <tr><td>40</td><td>Forty</td></tr>\n                <tr><td>50</td><td>Fifty</td></tr>\n                <tr><td>60</td><td>Sixty</td></tr>\n                <tr><td>70</td><td>Seventy</td></tr>\n                <tr><td>80</td><td>Eighty</td></tr>\n                <tr><td>90</td><td>Ninety</td></tr>\n                <tr><td>100</td><td>One hundred</td></tr>\n              </tbody>\n            </table>\n\n            <h3>💡 How to form numbers</h3>\n\n            <p>Para formar números del 21 al 99 que no son decenas exactas, combinamos las decenas con las unidades utilizando un guion.</p>\n\n            <p><strong>Examples:</strong></p>\n\n            <ul>\n              <li>21 → Twenty-one</li>\n              <li>32 → Thirty-two</li>\n              <li>45 → Forty-five</li>\n              <li>58 → Fifty-eight</li>\n              <li>67 → Sixty-seven</li>\n              <li>79 → Seventy-nine</li>\n              <li>84 → Eighty-four</li>\n              <li>96 → Ninety-six</li>\n            </ul>\n\n            <p><strong>Remember!</strong> Se escribe <strong>forty</strong>, no fourty; y <strong>fifteen</strong>, no fiveteen.</p>\n\n            <hr>\n\n            <h2>🕒 TELLING THE TIME</h2>\n\n            <p>Para preguntar la hora en inglés utilizamos:</p>\n\n            <p><strong>What time is it?</strong> — ¿Qué hora es?</p>\n\n            <p>Para responder comenzamos con:</p>\n\n            <p><strong>It's...</strong> — Son las... / Es la...</p>\n\n            <h3>1. O'clock — En punto</h3>\n\n            <p>Utilizamos <strong>o'clock</strong> cuando el reloj marca una hora exacta.</p>\n\n            <ul>\n              <li>1:00 → It's one o'clock.</li>\n              <li>3:00 → It's three o'clock.</li>\n              <li>6:00 → It's six o'clock.</li>\n              <li>10:00 → It's ten o'clock.</li>\n            </ul>\n\n            <h3>2. Half past — Y media</h3>\n\n            <p>Utilizamos <strong>half past</strong> cuando han pasado 30 minutos de una hora.</p>\n\n            <ul>\n              <li>2:30 → It's half past two.</li>\n              <li>4:30 → It's half past four.</li>\n              <li>7:30 → It's half past seven.</li>\n              <li>9:30 → It's half past nine.</li>\n            </ul>\n\n            <h3>3. Quarter past — Y cuarto</h3>\n\n            <p>Utilizamos <strong>a quarter past</strong> cuando han pasado 15 minutos de una hora.</p>\n\n            <ul>\n              <li>1:15 → It's a quarter past one.</li>\n              <li>3:15 → It's a quarter past three.</li>\n              <li>8:15 → It's a quarter past eight.</li>\n            </ul>\n\n            <h3>4. Quarter to — Cuarto para</h3>\n\n            <p>Utilizamos <strong>a quarter to</strong> cuando faltan 15 minutos para la siguiente hora.</p>\n\n            <ul>\n              <li>2:45 → It's a quarter to three.</li>\n              <li>5:45 → It's a quarter to six.</li>\n              <li>10:45 → It's a quarter to eleven.</li>\n            </ul>\n\n            <h3>5. Digital Time</h3>\n\n            <p>También podemos expresar la hora leyendo directamente los números del reloj digital.</p>\n\n            <ul>\n              <li>3:10 → It's three ten.</li>\n              <li>4:20 → It's four twenty.</li>\n              <li>6:30 → It's six thirty.</li>\n              <li>8:45 → It's eight forty-five.</li>\n            </ul>\n\n            <h3>⭐ Quick Review</h3>\n\n            <table>\n              <thead>\n                <tr>\n                  <th>Time</th>\n                  <th>Expression</th>\n                </tr>\n              </thead>\n              <tbody>\n                <tr><td>5:00</td><td>Five o'clock</td></tr>\n                <tr><td>5:15</td><td>A quarter past five</td></tr>\n                <tr><td>5:30</td><td>Half past five</td></tr>\n                <tr><td>5:45</td><td>A quarter to six</td></tr>\n              </tbody>\n            </table>\n\n            <p><strong>🎯 Your turn!</strong> Practica los números y las horas en las actividades siguientes.</p>\n          "
