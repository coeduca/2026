      "title": "Music Genres, Pets & Hobbies",
      "html": "\n            \u003carticle style=\"font-family:Arial,sans-serif;color:#1A1A1A;line-height:1.65;max-width:760px;margin:auto;\">\n\n              \u003cheader style=\"background:#FFF1F8;border-radius:16px;padding:18px 16px;text-align:center;margin-bottom:18px;\">\n                \u003cdiv style=\"font-size:34px;margin-bottom:8px;\">🎵 🐶 🎨\u003c/div>\n                \u003ch2 style=\"color:#D700AD;font-size:23px;line-height:1.3;margin:0 0 8px;\">\n                  Music Genres, Pets &amp; Hobbies\n                \u003c/h2>\n                \u003cp style=\"margin:0;font-size:14px;\">\n                  Aprende a hablar en inglés sobre tu música favorita, tus mascotas y tus pasatiempos.\n                \u003c/p>\n              \u003c/header>\n\n              \u003csection style=\"margin-bottom:20px;\">\n                \u003ch3 style=\"font-size:18px;color:#D700AD;margin:0 0 9px;\">\n                  🎵 1. Music Genres\n                \u003c/h3>\n                \u003cp style=\"margin:0 0 10px;\">\n                  \u003cstrong>Music genres\u003c/strong> son los diferentes géneros musicales.\n                \u003c/p>\n                \u003cdiv style=\"background:#FFF1F8;border-left:4px solid #D700AD;border-radius:10px;padding:12px 14px;\">\n                  \u003cp style=\"margin:0 0 6px;\">\u003cstrong>Pop\u003c/strong> — Música pop\u003c/p>\n                  \u003cp style=\"margin:0 0 6px;\">\u003cstrong>Rock\u003c/strong> — Música rock\u003c/p>\n                  \u003cp style=\"margin:0 0 6px;\">\u003cstrong>Reggae\u003c/strong> — Reggae\u003c/p>\n                  \u003cp style=\"margin:0 0 6px;\">\u003cstrong>Jazz\u003c/strong> — Jazz\u003c/p>\n                  \u003cp style=\"margin:0 0 6px;\">\u003cstrong>Hip-hop\u003c/strong> — Hip-hop\u003c/p>\n                  \u003cp style=\"margin:0;\">\u003cstrong>Classical music\u003c/strong> — Música clásica\u003c/p>\n                \u003c/div>\n                \u003cp style=\"margin:10px 0 3px;font-weight:bold;color:#D700AD;\">Example:\u003c/p>\n                \u003cp style=\"margin:0;background:#FFFFFF;border:1px solid #E4C9E9;padding:10px;border-radius:9px;\">\n                  I like pop music.\u003cbr>\n                  \u003cspan style=\"font-size:13px;color:#555555;\">Me gusta la música pop.\u003c/span>\n                \u003c/p>\n              \u003c/section>\n\n              \u003csection style=\"margin-bottom:20px;\">\n                \u003ch3 style=\"font-size:18px;color:#D700AD;margin:0 0 9px;\">\n                  🐾 2. Pets\n                \u003c/h3>\n                \u003cp style=\"margin:0 0 10px;\">\n                  \u003cstrong>Pets\u003c/strong> significa mascotas. Son animales que podemos tener en casa.\n                \u003c/p>\n                \u003cdiv style=\"background:#FFF1F8;border-left:4px solid #D700AD;border-radius:10px;padding:12px 14px;\">\n                  \u003cp style=\"margin:0 0 6px;\">🐶 \u003cstrong>Dog\u003c/strong> — Perro\u003c/p>\n                  \u003cp style=\"margin:0 0 6px;\">🐱 \u003cstrong>Cat\u003c/strong> — Gato\u003c/p>\n                  \u003cp style=\"margin:0 0 6px;\">🐰 \u003cstrong>Rabbit\u003c/strong> — Conejo\u003c/p>\n                  \u003cp style=\"margin:0 0 6px;\">🐹 \u003cstrong>Hamster\u003c/strong> — Hámster\u003c/p>\n                  \u003cp style=\"margin:0 0 6px;\">🐢 \u003cstrong>Turtle\u003c/strong> — Tortuga\u003c/p>\n                  \u003cp style=\"margin:0;\">🐟 \u003cstrong>Fish\u003c/strong> — Pez\u003c/p>\n                \u003c/div>\n                \u003cp style=\"margin:10px 0 3px;font-weight:bold;color:#D700AD;\">Example:\u003c/p>\n                \u003cp style=\"margin:0;background:#FFFFFF;border:1px solid #E4C9E9;padding:10px;border-radius:9px;\">\n                  I have a cat.\u003cbr>\n                  \u003cspan style=\"font-size:13px;color:#555555;\">Tengo un gato.\u003c/span>\n                \u003c/p>\n              \u003c/section>\n\n              \u003csection style=\"margin-bottom:20px;\">\n                \u003ch3 style=\"font-size:18px;color:#D700AD;margin:0 0 9px;\">\n                  🎨 3. Hobbies\n                \u003c/h3>\n                \u003cp style=\"margin:0 0 10px;\">\n                  \u003cstrong>Hobbies\u003c/strong> son actividades que hacemos por diversión en nuestro tiempo libre.\n                \u003c/p>\n                \u003cdiv style=\"background:#FFF1F8;border-left:4px solid #D700AD;border-radius:10px;padding:12px 14px;\">\n                  \u003cp style=\"margin:0 0 6px;\">📚 \u003cstrong>Reading\u003c/strong> — Leer\u003c/p>\n                  \u003cp style=\"margin:0 0 6px;\">🎨 \u003cstrong>Drawing\u003c/strong> — Dibujar\u003c/p>\n                  \u003cp style=\"margin:0 0 6px;\">💃 \u003cstrong>Dancing\u003c/strong> — Bailar\u003c/p>\n                  \u003cp style=\"margin:0 0 6px;\">🎤 \u003cstrong>Singing\u003c/strong> — Cantar\u003c/p>\n                  \u003cp style=\"margin:0 0 6px;\">🏊 \u003cstrong>Swimming\u003c/strong> — Nadar\u003c/p>\n                  \u003cp style=\"margin:0 0 6px;\">🚴 \u003cstrong>Cycling\u003c/strong> — Andar en bicicleta\u003c/p>\n                  \u003cp style=\"margin:0;\">⚽ \u003cstrong>Playing soccer\u003c/strong> — Jugar fútbol\u003c/p>\n                \u003c/div>\n                \u003cp style=\"margin:10px 0 3px;font-weight:bold;color:#D700AD;\">Example:\u003c/p>\n                \u003cp style=\"margin:0;background:#FFFFFF;border:1px solid #E4C9E9;padding:10px;border-radius:9px;\">\n                  I enjoy drawing after school.\u003cbr>\n                  \u003cspan style=\"font-size:13px;color:#555555;\">Disfruto dibujar después de clases.\u003c/span>\n                \u003c/p>\n              \u003c/section>\n\n              \u003csection style=\"background:#E4C9E9;border-radius:14px;padding:15px;margin-bottom:16px;\">\n                \u003ch3 style=\"color:#7D0067;font-size:17px;margin:0 0 9px;\">\n                  💬 Useful Expressions\n                \u003c/h3>\n                \u003cp style=\"margin:0 0 8px;\">\n                  \u003cstrong>What kind of music do you like?\u003c/strong>\u003cbr>\n                  \u003cspan style=\"font-size:13px;\">¿Qué tipo de música te gusta?\u003c/span>\n                \u003c/p>\n                \u003cp style=\"margin:0 0 8px;\">\n                  \u003cstrong>Do you have a pet?\u003c/strong>\u003cbr>\n                  \u003cspan style=\"font-size:13px;\">¿Tienes una mascota?\u003c/span>\n                \u003c/p>\n                \u003cp style=\"margin:0;\">\n                  \u003cstrong>What is your favorite hobby?\u003c/strong>\u003cbr>\n                  \u003cspan style=\"font-size:13px;\">¿Cuál es tu pasatiempo favorito?\u003c/span>\n                \u003c/p>\n              \u003c/section>\n\n              \u003csection style=\"border:1px solid #E4C9E9;border-radius:12px;padding:14px;margin-bottom:14px;\">\n                \u003ch3 style=\"color:#D700AD;font-size:17px;margin:0 0 8px;\">\n                  ✏️ Grammar Tip\n                \u003c/h3>\n                \u003cp style=\"margin:0 0 9px;\">\n                  Para hablar de pasatiempos podemos usar \u003cstrong>like, love o enjoy\u003c/strong> seguidos de un verbo terminado en \u003cstrong>-ing\u003c/strong>.\n                \u003c/p>\n                \u003cp style=\"margin:0 0 6px;\">\u003cstrong>I like swimming.\u003c/strong>\u003c/p>\n                \u003cp style=\"margin:0 0 6px;\">\u003cstrong>She loves dancing.\u003c/strong>\u003c/p>\n                \u003cp style=\"margin:0 0 12px;\">\u003cstrong>He enjoys reading.\u003c/strong>\u003c/p>\n                \u003cp style=\"margin:0 0 6px;\">\n                  Recuerda que con \u003cstrong>he\u003c/strong> y \u003cstrong>she\u003c/strong> usamos \u003cstrong>likes, loves, enjoys\u003c/strong> y \u003cstrong>has\u003c/strong>.\n                \u003c/p>\n                \u003cp style=\"margin:0 0 6px;\">\u003cstrong>She likes rock music.\u003c/strong>\u003c/p>\n                \u003cp style=\"margin:0;\">\u003cstrong>He has a rabbit.\u003c/strong>\u003c/p>\n              \u003c/section>\n\n              \u003cfooter style=\"text-align:center;background:#FFF1F8;border-radius:12px;padding:12px;\">\n                \u003cp style=\"margin:0;font-weight:bold;color:#D700AD;\">\n                  🌟 Ready to practice?\n                \u003c/p>\n                \u003cp style=\"margin:4px 0 0;font-size:13px;\">\n                  ¡Ahora demuestra lo que aprendiste!\n                \u003c/p>\n              \u003c/footer>\n\n            \u003c/article>\n          "
    },
