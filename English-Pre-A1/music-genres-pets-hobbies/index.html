      "title": "Music Genres, Pets & Hobbies",
      "html": "\n            <article style=\"font-family:Arial,sans-serif;color:#1A1A1A;line-height:1.65;max-width:760px;margin:auto;\">\n\n              <header style=\"background:#FFF1F8;border-radius:16px;padding:18px 16px;text-align:center;margin-bottom:18px;\">\n                <div style=\"font-size:34px;margin-bottom:8px;\">🎵 🐶 🎨</div>\n                <h2 style=\"color:#D700AD;font-size:23px;line-height:1.3;margin:0 0 8px;\">\n                  Music Genres, Pets &amp; Hobbies\n                </h2>\n                <p style=\"margin:0;font-size:14px;\">\n                  Aprende a hablar en inglés sobre tu música favorita, tus mascotas y tus pasatiempos.\n                </p>\n              </header>\n\n              <section style=\"margin-bottom:20px;\">\n                <h3 style=\"font-size:18px;color:#D700AD;margin:0 0 9px;\">\n                  🎵 1. Music Genres\n                </h3>\n                <p style=\"margin:0 0 10px;\">\n                  <strong>Music genres</strong> son los diferentes géneros musicales.\n                </p>\n                <div style=\"background:#FFF1F8;border-left:4px solid #D700AD;border-radius:10px;padding:12px 14px;\">\n                  <p style=\"margin:0 0 6px;\"><strong>Pop</strong> — Música pop</p>\n                  <p style=\"margin:0 0 6px;\"><strong>Rock</strong> — Música rock</p>\n                  <p style=\"margin:0 0 6px;\"><strong>Reggae</strong> — Reggae</p>\n                  <p style=\"margin:0 0 6px;\"><strong>Jazz</strong> — Jazz</p>\n                  <p style=\"margin:0 0 6px;\"><strong>Hip-hop</strong> — Hip-hop</p>\n                  <p style=\"margin:0;\"><strong>Classical music</strong> — Música clásica</p>\n                </div>\n                <p style=\"margin:10px 0 3px;font-weight:bold;color:#D700AD;\">Example:</p>\n                <p style=\"margin:0;background:#FFFFFF;border:1px solid #E4C9E9;padding:10px;border-radius:9px;\">\n                  I like pop music.<br>\n                  <span style=\"font-size:13px;color:#555555;\">Me gusta la música pop.</span>\n                </p>\n              </section>\n\n              <section style=\"margin-bottom:20px;\">\n                <h3 style=\"font-size:18px;color:#D700AD;margin:0 0 9px;\">\n                  🐾 2. Pets\n                </h3>\n                <p style=\"margin:0 0 10px;\">\n                  <strong>Pets</strong> significa mascotas. Son animales que podemos tener en casa.\n                </p>\n                <div style=\"background:#FFF1F8;border-left:4px solid #D700AD;border-radius:10px;padding:12px 14px;\">\n                  <p style=\"margin:0 0 6px;\">🐶 <strong>Dog</strong> — Perro</p>\n                  <p style=\"margin:0 0 6px;\">🐱 <strong>Cat</strong> — Gato</p>\n                  <p style=\"margin:0 0 6px;\">🐰 <strong>Rabbit</strong> — Conejo</p>\n                  <p style=\"margin:0 0 6px;\">🐹 <strong>Hamster</strong> — Hámster</p>\n                  <p style=\"margin:0 0 6px;\">🐢 <strong>Turtle</strong> — Tortuga</p>\n                  <p style=\"margin:0;\">🐟 <strong>Fish</strong> — Pez</p>\n                </div>\n                <p style=\"margin:10px 0 3px;font-weight:bold;color:#D700AD;\">Example:</p>\n                <p style=\"margin:0;background:#FFFFFF;border:1px solid #E4C9E9;padding:10px;border-radius:9px;\">\n                  I have a cat.<br>\n                  <span style=\"font-size:13px;color:#555555;\">Tengo un gato.</span>\n                </p>\n              </section>\n\n              <section style=\"margin-bottom:20px;\">\n                <h3 style=\"font-size:18px;color:#D700AD;margin:0 0 9px;\">\n                  🎨 3. Hobbies\n                </h3>\n                <p style=\"margin:0 0 10px;\">\n                  <strong>Hobbies</strong> son actividades que hacemos por diversión en nuestro tiempo libre.\n                </p>\n                <div style=\"background:#FFF1F8;border-left:4px solid #D700AD;border-radius:10px;padding:12px 14px;\">\n                  <p style=\"margin:0 0 6px;\">📚 <strong>Reading</strong> — Leer</p>\n                  <p style=\"margin:0 0 6px;\">🎨 <strong>Drawing</strong> — Dibujar</p>\n                  <p style=\"margin:0 0 6px;\">💃 <strong>Dancing</strong> — Bailar</p>\n                  <p style=\"margin:0 0 6px;\">🎤 <strong>Singing</strong> — Cantar</p>\n                  <p style=\"margin:0 0 6px;\">🏊 <strong>Swimming</strong> — Nadar</p>\n                  <p style=\"margin:0 0 6px;\">🚴 <strong>Cycling</strong> — Andar en bicicleta</p>\n                  <p style=\"margin:0;\">⚽ <strong>Playing soccer</strong> — Jugar fútbol</p>\n                </div>\n                <p style=\"margin:10px 0 3px;font-weight:bold;color:#D700AD;\">Example:</p>\n                <p style=\"margin:0;background:#FFFFFF;border:1px solid #E4C9E9;padding:10px;border-radius:9px;\">\n                  I enjoy drawing after school.<br>\n                  <span style=\"font-size:13px;color:#555555;\">Disfruto dibujar después de clases.</span>\n                </p>\n              </section>\n\n              <section style=\"background:#E4C9E9;border-radius:14px;padding:15px;margin-bottom:16px;\">\n                <h3 style=\"color:#7D0067;font-size:17px;margin:0 0 9px;\">\n                  💬 Useful Expressions\n                </h3>\n                <p style=\"margin:0 0 8px;\">\n                  <strong>What kind of music do you like?</strong><br>\n                  <span style=\"font-size:13px;\">¿Qué tipo de música te gusta?</span>\n                </p>\n                <p style=\"margin:0 0 8px;\">\n                  <strong>Do you have a pet?</strong><br>\n                  <span style=\"font-size:13px;\">¿Tienes una mascota?</span>\n                </p>\n                <p style=\"margin:0;\">\n                  <strong>What is your favorite hobby?</strong><br>\n                  <span style=\"font-size:13px;\">¿Cuál es tu pasatiempo favorito?</span>\n                </p>\n              </section>\n\n              <section style=\"border:1px solid #E4C9E9;border-radius:12px;padding:14px;margin-bottom:14px;\">\n                <h3 style=\"color:#D700AD;font-size:17px;margin:0 0 8px;\">\n                  ✏️ Grammar Tip\n                </h3>\n                <p style=\"margin:0 0 9px;\">\n                  Para hablar de pasatiempos podemos usar <strong>like, love o enjoy</strong> seguidos de un verbo terminado en <strong>-ing</strong>.\n                </p>\n                <p style=\"margin:0 0 6px;\"><strong>I like swimming.</strong></p>\n                <p style=\"margin:0 0 6px;\"><strong>She loves dancing.</strong></p>\n                <p style=\"margin:0 0 12px;\"><strong>He enjoys reading.</strong></p>\n                <p style=\"margin:0 0 6px;\">\n                  Recuerda que con <strong>he</strong> y <strong>she</strong> usamos <strong>likes, loves, enjoys</strong> y <strong>has</strong>.\n                </p>\n                <p style=\"margin:0 0 6px;\"><strong>She likes rock music.</strong></p>\n                <p style=\"margin:0;\"><strong>He has a rabbit.</strong></p>\n              </section>\n\n              <footer style=\"text-align:center;background:#FFF1F8;border-radius:12px;padding:12px;\">\n                <p style=\"margin:0;font-weight:bold;color:#D700AD;\">\n                  🌟 Ready to practice?\n                </p>\n                <p style=\"margin:4px 0 0;font-size:13px;\">\n                  ¡Ahora demuestra lo que aprendiste!\n                </p>\n              </footer>\n\n            </article>\n          "
