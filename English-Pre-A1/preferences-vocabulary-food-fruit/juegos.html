      "type": "note",
      "title": "Let’s Talk About Food!",
      "html": "\u003csection style='font-family:Arial,sans-serif;color:#1A1A1A;line-height:1.6;max-width:100%;'>\u003cheader style='background:#C0F781;border-radius:16px;padding:18px;text-align:center;margin-bottom:16px;'>\u003ch2 style='margin:0;font-size:23px;color:#1A1A1A;'>🍎 Food, Fruit & Preferences 🍕\u003c/h2>\u003cp style='margin:7px 0 0;font-size:14px;'>Learn to talk about the foods you like and dislike!\u003c/p>\u003c/header>\u003csection style='margin-bottom:17px;'>\u003ch3 style='font-size:18px;color:#287A48;margin:0 0 8px;'>🍓 Food Vocabulary\u003c/h3>\u003cp style='margin:0 0 8px;'>We use \u003cstrong>food\u003c/strong> to talk about what we eat. \u003cstrong>Fruit\u003c/strong> is one type of food.\u003c/p>\u003cdiv style='background:#F1FBE9;padding:12px;border-radius:12px;'>\u003cp style='margin:0 0 7px;'>\u003cstrong>🍌 Fruits (frutas):\u003c/strong> apple, banana, mango, orange, grapes, strawberry, pineapple, watermelon.\u003c/p>\u003cp style='margin:0;'>\u003cstrong>🍕 Other foods (otros alimentos):\u003c/strong> pizza, rice, bread, chicken, cheese, eggs, soup, sandwich.\u003c/p>\u003c/div>\u003c/section>\u003csection style='margin-bottom:17px;'>\u003ch3 style='font-size:18px;color:#287A48;margin:0 0 8px;'>❤️ Expressing Preferences\u003c/h3>\u003cp style='margin:0 0 9px;'>Use these expressions to talk about your favorite foods and fruits.\u003c/p>\u003cdiv style='background:#FFF1F8;border-radius:12px;padding:12px;'>\u003cp style='margin:0 0 6px;'>😍 \u003cstrong>I love...\u003c/strong> = Me encanta(n)...\u003c/p>\u003cp style='margin:0 0 6px;'>😊 \u003cstrong>I like...\u003c/strong> = Me gusta(n)...\u003c/p>\u003cp style='margin:0 0 6px;'>😋 \u003cstrong>I prefer...\u003c/strong> = Prefiero...\u003c/p>\u003cp style='margin:0 0 6px;'>🙁 \u003cstrong>I don't like...\u003c/strong> = No me gusta(n)...\u003c/p>\u003cp style='margin:0;'>😖 \u003cstrong>I hate...\u003c/strong> = Odio...\u003c/p>\u003c/div>\u003c/section>\u003csection style='margin-bottom:17px;'>\u003ch3 style='font-size:18px;color:#287A48;margin:0 0 8px;'>✏️ Grammar Tips\u003c/h3>\u003cdiv style='border-left:4px solid #43B069;padding:4px 0 4px 12px;'>\u003cp style='margin:0 0 8px;'>\u003cstrong>I / You / We / They\u003c/strong> → like, love, prefer, don't like.\u003c/p>\u003cp style='margin:0 0 8px;'>\u003cstrong>He / She\u003c/strong> → likes, loves, prefers, doesn't like.\u003c/p>\u003cp style='margin:0 0 8px;'>\u003cstrong>Questions:\u003c/strong> Do you like...? / Does she like...?\u003c/p>\u003cp style='margin:0;'>\u003cstrong>Short answers:\u003c/strong> Yes, I do. / No, I don't. / Yes, she does. / No, she doesn't.\u003c/p>\u003c/div>\u003cp style='background:#F1FBE9;padding:10px;border-radius:10px;font-size:14px;margin:10px 0 0;'>💡 After \u003cstrong>does\u003c/strong> or \u003cstrong>doesn't\u003c/strong>, use \u003cstrong>like\u003c/strong>, not \u003cstrong>likes\u003c/strong>.\u003c/p>\u003c/section>\u003csection>\u003ch3 style='font-size:18px;color:#287A48;margin:0 0 10px;'>💬 Examples\u003c/h3>\u003cdiv style='background:#F4FBEF;border-radius:12px;padding:12px;margin-bottom:8px;'>\u003cstrong>1. I love mangoes. 🥭\u003c/strong>\u003cp style='margin:3px 0 0;font-size:13px;color:#495749;'>Me encantan los mangos.\u003c/p>\u003c/div>\u003cdiv style='background:#F4FBEF;border-radius:12px;padding:12px;margin-bottom:8px;'>\u003cstrong>2. She doesn't like onions. 🧅\u003c/strong>\u003cp style='margin:3px 0 0;font-size:13px;color:#495749;'>A ella no le gustan las cebollas.\u003c/p>\u003c/div>\u003cdiv style='background:#F4FBEF;border-radius:12px;padding:12px;'>\u003cstrong>3. Do you like apples? 🍎\u003c/strong>\u003cp style='margin:4px 0 0;'>Yes, I do. / No, I don't.\u003c/p>\u003cp style='margin:4px 0 0;font-size:13px;color:#495749;'>¿Te gustan las manzanas? Sí. / No.\u003c/p>\u003c/div>\u003c/section>\u003cp style='text-align:center;background:#C0F781;border-radius:12px;padding:12px;margin:17px 0 0;font-weight:bold;'>🌟 Now it's your turn! Practice your English.\u003c/p>\u003c/section>"
