      "type": "note",
      "title": "Let’s Talk About Food!",
      "html": "<section style='font-family:Arial,sans-serif;color:#1A1A1A;line-height:1.6;max-width:100%;'><header style='background:#C0F781;border-radius:16px;padding:18px;text-align:center;margin-bottom:16px;'><h2 style='margin:0;font-size:23px;color:#1A1A1A;'>🍎 Food, Fruit & Preferences 🍕</h2><p style='margin:7px 0 0;font-size:14px;'>Learn to talk about the foods you like and dislike!</p></header><section style='margin-bottom:17px;'><h3 style='font-size:18px;color:#287A48;margin:0 0 8px;'>🍓 Food Vocabulary</h3><p style='margin:0 0 8px;'>We use <strong>food</strong> to talk about what we eat. <strong>Fruit</strong> is one type of food.</p><div style='background:#F1FBE9;padding:12px;border-radius:12px;'><p style='margin:0 0 7px;'><strong>🍌 Fruits (frutas):</strong> apple, banana, mango, orange, grapes, strawberry, pineapple, watermelon.</p><p style='margin:0;'><strong>🍕 Other foods (otros alimentos):</strong> pizza, rice, bread, chicken, cheese, eggs, soup, sandwich.</p></div></section><section style='margin-bottom:17px;'><h3 style='font-size:18px;color:#287A48;margin:0 0 8px;'>❤️ Expressing Preferences</h3><p style='margin:0 0 9px;'>Use these expressions to talk about your favorite foods and fruits.</p><div style='background:#FFF1F8;border-radius:12px;padding:12px;'><p style='margin:0 0 6px;'>😍 <strong>I love...</strong> = Me encanta(n)...</p><p style='margin:0 0 6px;'>😊 <strong>I like...</strong> = Me gusta(n)...</p><p style='margin:0 0 6px;'>😋 <strong>I prefer...</strong> = Prefiero...</p><p style='margin:0 0 6px;'>🙁 <strong>I don't like...</strong> = No me gusta(n)...</p><p style='margin:0;'>😖 <strong>I hate...</strong> = Odio...</p></div></section><section style='margin-bottom:17px;'><h3 style='font-size:18px;color:#287A48;margin:0 0 8px;'>✏️ Grammar Tips</h3><div style='border-left:4px solid #43B069;padding:4px 0 4px 12px;'><p style='margin:0 0 8px;'><strong>I / You / We / They</strong> → like, love, prefer, don't like.</p><p style='margin:0 0 8px;'><strong>He / She</strong> → likes, loves, prefers, doesn't like.</p><p style='margin:0 0 8px;'><strong>Questions:</strong> Do you like...? / Does she like...?</p><p style='margin:0;'><strong>Short answers:</strong> Yes, I do. / No, I don't. / Yes, she does. / No, she doesn't.</p></div><p style='background:#F1FBE9;padding:10px;border-radius:10px;font-size:14px;margin:10px 0 0;'>💡 After <strong>does</strong> or <strong>doesn't</strong>, use <strong>like</strong>, not <strong>likes</strong>.</p></section><section><h3 style='font-size:18px;color:#287A48;margin:0 0 10px;'>💬 Examples</h3><div style='background:#F4FBEF;border-radius:12px;padding:12px;margin-bottom:8px;'><strong>1. I love mangoes. 🥭</strong><p style='margin:3px 0 0;font-size:13px;color:#495749;'>Me encantan los mangos.</p></div><div style='background:#F4FBEF;border-radius:12px;padding:12px;margin-bottom:8px;'><strong>2. She doesn't like onions. 🧅</strong><p style='margin:3px 0 0;font-size:13px;color:#495749;'>A ella no le gustan las cebollas.</p></div><div style='background:#F4FBEF;border-radius:12px;padding:12px;'><strong>3. Do you like apples? 🍎</strong><p style='margin:4px 0 0;'>Yes, I do. / No, I don't.</p><p style='margin:4px 0 0;font-size:13px;color:#495749;'>¿Te gustan las manzanas? Sí. / No.</p></div></section><p style='text-align:center;background:#C0F781;border-radius:12px;padding:12px;margin:17px 0 0;font-weight:bold;'>🌟 Now it's your turn! Practice your English.</p></section>"
