      "html": "<div class=\"grammar-note\"><h2>📒 Simple Present Negative</h2><p><strong>✍️ Copia esta información en tu cuaderno.</strong></p><hr><h3>1. ¿Para qué lo usamos?</h3><p>Usamos el presente simple negativo para decir que una persona <strong>NO hace</strong> algo habitualmente.</p><h3>2. Estructura con I, You, We, They</h3><p><strong>Subject + don&#39;t + verb + complement</strong></p><p>✅ I <strong>don&#39;t play</strong> football.</p><p>✅ They <strong>don&#39;t study</strong> at night.</p><h3>3. Estructura con He, She, It</h3><p><strong>Subject + doesn&#39;t + verb + complement</strong></p><p>✅ He <strong>doesn&#39;t eat</strong> pizza.</p><p>✅ She <strong>doesn&#39;t watch</strong> TV.</p><h3>⚠️ Regla importante</h3><p>Después de <strong>don&#39;t</strong> y <strong>doesn&#39;t</strong>, el verbo siempre va en su forma base.</p><p>❌ He doesn&#39;t <strong>plays</strong> football.</p><p>✅ He doesn&#39;t <strong>play</strong> football.</p><hr><p><strong>DON&#39;T:</strong> I · You · We · They</p><p><strong>DOESN&#39;T:</strong> He · She · It</p></div>"
