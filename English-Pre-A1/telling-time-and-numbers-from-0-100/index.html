    {
      "type": "note",
      "title": "Let’s Learn! Numbers & Time",
      "instruction": "Lee esta explicación antes de comenzar tu examen.",
      "html": "\n            <section style=\"font-family:Arial,sans-serif;color:#1A1A1A;line-height:1.65;max-width:100%;\">\n\n              <header style=\"background:#8800FF;color:#FFFFFF;padding:20px 16px;border-radius:14px;text-align:center;margin-bottom:18px;\">\n                <div style=\"font-size:35px;margin-bottom:5px;\">🔢 🕒</div>\n                <h2 style=\"margin:0;font-size:23px;font-weight:800;line-height:1.3;\">Numbers & Telling Time</h2>\n                <p style=\"margin:8px 0 0;font-size:14px;color:#FFFFFF;\">¡Aprendamos a expresar números y horas en inglés!</p>\n              </header>\n\n              <section style=\"margin-bottom:18px;\">\n                <h3 style=\"color:#8800FF;font-size:19px;margin:0 0 10px;\">🔢 1. Numbers from 0 to 100</h3>\n                <p style=\"margin:0 0 12px;font-size:14px;\">En inglés utilizamos <strong>numbers</strong> para expresar cantidades, edades y mucho más.</p>\n\n                <div style=\"background:#F2ECFF;border-radius:12px;padding:14px;\">\n                  <p style=\"margin:0 0 8px;font-size:13px;font-weight:700;color:#6500BF;\">BASIC NUMBERS</p>\n                  <p style=\"margin:0 0 7px;font-size:14px;\">0 — zero | 1 — one | 2 — two | 3 — three</p>\n                  <p style=\"margin:0 0 7px;font-size:14px;\">4 — four | 5 — five | 6 — six | 7 — seven</p>\n                  <p style=\"margin:0 0 7px;font-size:14px;\">8 — eight | 9 — nine | 10 — ten</p>\n                  <p style=\"margin:0;font-size:14px;\">11 — eleven | 12 — twelve | 13 — thirteen</p>\n                </div>\n\n                <div style=\"margin-top:10px;background:#FFF4D4;border-radius:12px;padding:14px;\">\n                  <p style=\"margin:0 0 8px;font-size:13px;font-weight:700;color:#805000;\">TENS — DECENAS</p>\n                  <p style=\"margin:0 0 7px;font-size:14px;\">20 — twenty | 30 — thirty | 40 — forty</p>\n                  <p style=\"margin:0 0 7px;font-size:14px;\">50 — fifty | 60 — sixty | 70 — seventy</p>\n                  <p style=\"margin:0;font-size:14px;\">80 — eighty | 90 — ninety | 100 — one hundred</p>\n                </div>\n\n                <p style=\"font-size:14px;margin:12px 0 0;\">Para formar números como <strong>twenty-one (21)</strong> o <strong>seventy-five (75)</strong>, unimos la decena y la unidad con un guion.</p>\n                <p style=\"font-size:13px;margin:8px 0 0;color:#555555;\"><strong>Remember:</strong> 40 se escribe <strong>forty</strong>, no fourty.</p>\n              </section>\n\n              <section style=\"margin-bottom:18px;\">\n                <h3 style=\"color:#8800FF;font-size:19px;margin:0 0 10px;\">🕒 2. Telling Time</h3>\n                <p style=\"margin:0 0 12px;font-size:14px;\">Para preguntar la hora utilizamos <strong>What time is it?</strong> (¿Qué hora es?). Para responder podemos comenzar con <strong>It is...</strong> o <strong>It's...</strong>.</p>\n\n                <div style=\"border:2px solid #C9DBE9;border-radius:12px;overflow:hidden;\">\n                  <div style=\"padding:12px;background:#F2ECFF;\">\n                    <strong style=\"color:#7000D6;\">O'CLOCK</strong>\n                    <p style=\"margin:4px 0 0;font-size:14px;\">Se utiliza cuando es una hora exacta, sin minutos adicionales.</p>\n                  </div>\n                  <div style=\"padding:12px;background:#FFFFFF;\">\n                    <strong style=\"color:#7000D6;\">HALF PAST</strong>\n                    <p style=\"margin:4px 0 0;font-size:14px;\">Significa que han pasado 30 minutos de una hora.</p>\n                  </div>\n                  <div style=\"padding:12px;background:#F2ECFF;\">\n                    <strong style=\"color:#7000D6;\">QUARTER PAST</strong>\n                    <p style=\"margin:4px 0 0;font-size:14px;\">Significa que han pasado 15 minutos de una hora.</p>\n                  </div>\n                  <div style=\"padding:12px;background:#FFFFFF;\">\n                    <strong style=\"color:#7000D6;\">QUARTER TO</strong>\n                    <p style=\"margin:4px 0 0;font-size:14px;\">Significa que faltan 15 minutos para la siguiente hora.</p>\n                  </div>\n                </div>\n\n                <p style=\"font-size:14px;margin:12px 0 0;\">También utilizamos <strong>past</strong> para los minutos después de la hora y <strong>to</strong> para los minutos que faltan para la siguiente hora.</p>\n              </section>\n\n              <section style=\"margin-bottom:14px;\">\n                <h3 style=\"color:#8800FF;font-size:19px;margin:0 0 10px;\">✨ 3. Examples</h3>\n\n                <div style=\"background:#C9DBE9;border-radius:12px;padding:13px;margin-bottom:9px;\">\n                  <div style=\"font-size:22px;font-weight:800;color:#6800C8;\">8:00</div>\n                  <div style=\"font-size:15px;font-weight:700;\">It is eight o'clock.</div>\n                  <div style=\"font-size:13px;\">Son las ocho en punto.</div>\n                </div>\n\n                <div style=\"background:#C9DBE9;border-radius:12px;padding:13px;margin-bottom:9px;\">\n                  <div style=\"font-size:22px;font-weight:800;color:#6800C8;\">2:30</div>\n                  <div style=\"font-size:15px;font-weight:700;\">It is half past two.</div>\n                  <div style=\"font-size:13px;\">Son las dos y media.</div>\n                </div>\n\n                <div style=\"background:#C9DBE9;border-radius:12px;padding:13px;\">\n                  <div style=\"font-size:22px;font-weight:800;color:#6800C8;\">6:45</div>\n                  <div style=\"font-size:15px;font-weight:700;\">It is quarter to seven.</div>\n                  <div style=\"font-size:13px;\">Son las siete menos cuarto.</div>\n                </div>\n              </section>\n\n              <aside style=\"background:#FFBC00;border-radius:12px;padding:14px;\">\n                <p style=\"margin:0;font-size:14px;\"><strong>💡 Remember!</strong> Lee con atención cada pregunta. Puedes escribir números, reconocer horas y completar expresiones. ¡Confía en lo que has aprendido!</p>\n              </aside>\n\n            </section>\n          "
