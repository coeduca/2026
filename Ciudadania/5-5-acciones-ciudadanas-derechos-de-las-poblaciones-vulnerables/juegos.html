        "html": "\u003carticle style=\"font-family:Arial,sans-serif;color:#1A1A1A;line-height:1.65;font-size:15px;\">\u003cheader style=\"background:#3763D4;color:#FFFFFF;padding:17px;border-radius:13px 13px 0 0;\">\u003ch2 style=\"font-size:21px;line-height:1.3;margin:0;color:#FFFFFF;\">Acciones ciudadanas y derechos humanos\u003c/h2>\u003cp style=\"font-size:13px;margin:7px 0 0;color:#FFFFFF;\">Unidad 5 · Semana 5 · Octavo grado\u003c/p>\u003c/header>\u003cdiv style=\"border:1px solid #E9E5C9;border-top:0;border-radius:0 0 13px 13px;background:#FFFFFF;padding:17px;\">\u003ch3 style=\"font-size:17px;color:#3763D4;margin:0 0 8px;\">¿Qué es la vulnerabilidad?\u003c/h3>\u003cp style=\"margin:0 0 13px;\">Una persona o un grupo se encuentra en \u003cstrong>situación de vulnerabilidad\u003c/strong> cuando enfrenta condiciones que dificultan su desarrollo pleno y el ejercicio de sus derechos humanos. Estas dificultades pueden relacionarse con la discriminación, la pobreza, la exclusión o las condiciones de su entorno.\u003c/p>\u003ch3 style=\"font-size:17px;color:#3763D4;margin:15px 0 8px;\">Tipos de vulnerabilidad\u003c/h3>\u003cul style=\"padding-left:21px;margin:0 0 14px;\">\u003cli>\u003cstrong>Social:\u003c/strong> exclusión relacionada con la edad, el género, la etnia o la situación migratoria.\u003c/li>\u003cli>\u003cstrong>Económica:\u003c/strong> pobreza, desempleo e inseguridad alimentaria.\u003c/li>\u003cli>\u003cstrong>Cultural:\u003c/strong> dificultades vinculadas con la religión, el idioma o la identidad.\u003c/li>\u003cli>\u003cstrong>Ambiental:\u003c/strong> exposición a desastres naturales y otros riesgos del territorio.\u003c/li>\u003c/ul>\u003ch3 style=\"font-size:17px;color:#3763D4;margin:15px 0 8px;\">¿Qué poblaciones necesitan especial atención?\u003c/h3>\u003cp style=\"margin:0 0 13px;\">Entre los grupos estudiados se encuentran \u003cstrong>la niñez y adolescencia, las mujeres, las personas con discapacidad, las personas mayores, quienes viven en extrema pobreza, las minorías étnicas y las personas migrantes y refugiadas.\u003c/strong>\u003c/p>\u003cp style=\"margin:0 0 14px;\">Todas las personas tienen los mismos derechos. Sin embargo, algunas necesitan medidas específicas para superar las dificultades que impiden ejercerlos plenamente.\u003c/p>\u003cdiv style=\"background:#F5E7B2;border-left:4px solid #3763D4;border-radius:8px;padding:12px 14px;margin:14px 0;\">\u003ch3 style=\"font-size:16px;margin:0 0 7px;color:#1A1A1A;\">Valores fundamentales\u003c/h3>\u003cp style=\"margin:0;\">\u003cstrong>Inclusión:\u003c/strong> crear oportunidades de participación.\u003cbr>\u003cstrong>Igualdad:\u003c/strong> reconocer los mismos derechos para todas las personas.\u003cbr>\u003cstrong>Equidad:\u003c/strong> atender las necesidades particulares para lograr igualdad en el ejercicio de los derechos.\u003cbr>\u003cstrong>Justicia:\u003c/strong> crear condiciones para el desarrollo individual y social.\u003c/p>\u003c/div>\u003ch3 style=\"font-size:17px;color:#3763D4;margin:16px 0 8px;\">¿Qué podemos hacer como ciudadanos?\u003c/h3>\u003cul style=\"padding-left:21px;margin:0 0 13px;\">\u003cli>Denunciar las violaciones a los derechos humanos.\u003c/li>\u003cli>Conocer y promover los mecanismos de protección de los derechos.\u003c/li>\u003cli>Participar en proyectos escolares o locales en beneficio de las poblaciones vulnerables.\u003c/li>\u003cli>Generar espacios de convivencia y participación ciudadana para difundir los derechos humanos.\u003c/li>\u003c/ul>\u003cp style=\"background:#E9E5C9;border-radius:9px;padding:12px;margin:14px 0 0;\">\u003cstrong>Recuerda:\u003c/strong> proteger a las personas en situación de vulnerabilidad no significa considerarlas incapaces, sino reconocer sus derechos, eliminar barreras y contribuir a una sociedad más justa, equitativa, inclusiva e igualitaria.\u003c/p>\u003c/div>\u003c/article>"
