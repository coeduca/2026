        "html": "<article style=\"font-family:Arial,sans-serif;color:#1A1A1A;line-height:1.65;font-size:15px;\"><header style=\"background:#3763D4;color:#FFFFFF;padding:17px;border-radius:13px 13px 0 0;\"><h2 style=\"font-size:21px;line-height:1.3;margin:0;color:#FFFFFF;\">Acciones ciudadanas y derechos humanos</h2><p style=\"font-size:13px;margin:7px 0 0;color:#FFFFFF;\">Unidad 5 · Semana 5 · Octavo grado</p></header><div style=\"border:1px solid #E9E5C9;border-top:0;border-radius:0 0 13px 13px;background:#FFFFFF;padding:17px;\"><h3 style=\"font-size:17px;color:#3763D4;margin:0 0 8px;\">¿Qué es la vulnerabilidad?</h3><p style=\"margin:0 0 13px;\">Una persona o un grupo se encuentra en <strong>situación de vulnerabilidad</strong> cuando enfrenta condiciones que dificultan su desarrollo pleno y el ejercicio de sus derechos humanos. Estas dificultades pueden relacionarse con la discriminación, la pobreza, la exclusión o las condiciones de su entorno.</p><h3 style=\"font-size:17px;color:#3763D4;margin:15px 0 8px;\">Tipos de vulnerabilidad</h3><ul style=\"padding-left:21px;margin:0 0 14px;\"><li><strong>Social:</strong> exclusión relacionada con la edad, el género, la etnia o la situación migratoria.</li><li><strong>Económica:</strong> pobreza, desempleo e inseguridad alimentaria.</li><li><strong>Cultural:</strong> dificultades vinculadas con la religión, el idioma o la identidad.</li><li><strong>Ambiental:</strong> exposición a desastres naturales y otros riesgos del territorio.</li></ul><h3 style=\"font-size:17px;color:#3763D4;margin:15px 0 8px;\">¿Qué poblaciones necesitan especial atención?</h3><p style=\"margin:0 0 13px;\">Entre los grupos estudiados se encuentran <strong>la niñez y adolescencia, las mujeres, las personas con discapacidad, las personas mayores, quienes viven en extrema pobreza, las minorías étnicas y las personas migrantes y refugiadas.</strong></p><p style=\"margin:0 0 14px;\">Todas las personas tienen los mismos derechos. Sin embargo, algunas necesitan medidas específicas para superar las dificultades que impiden ejercerlos plenamente.</p><div style=\"background:#F5E7B2;border-left:4px solid #3763D4;border-radius:8px;padding:12px 14px;margin:14px 0;\"><h3 style=\"font-size:16px;margin:0 0 7px;color:#1A1A1A;\">Valores fundamentales</h3><p style=\"margin:0;\"><strong>Inclusión:</strong> crear oportunidades de participación.<br><strong>Igualdad:</strong> reconocer los mismos derechos para todas las personas.<br><strong>Equidad:</strong> atender las necesidades particulares para lograr igualdad en el ejercicio de los derechos.<br><strong>Justicia:</strong> crear condiciones para el desarrollo individual y social.</p></div><h3 style=\"font-size:17px;color:#3763D4;margin:16px 0 8px;\">¿Qué podemos hacer como ciudadanos?</h3><ul style=\"padding-left:21px;margin:0 0 13px;\"><li>Denunciar las violaciones a los derechos humanos.</li><li>Conocer y promover los mecanismos de protección de los derechos.</li><li>Participar en proyectos escolares o locales en beneficio de las poblaciones vulnerables.</li><li>Generar espacios de convivencia y participación ciudadana para difundir los derechos humanos.</li></ul><p style=\"background:#E9E5C9;border-radius:9px;padding:12px;margin:14px 0 0;\"><strong>Recuerda:</strong> proteger a las personas en situación de vulnerabilidad no significa considerarlas incapaces, sino reconocer sus derechos, eliminar barreras y contribuir a una sociedad más justa, equitativa, inclusiva e igualitaria.</p></div></article>"
