        "html": "\u003carticle style=\"font-family:Arial,sans-serif;color:#1A1A1A;font-size:15px;line-height:1.65;\">\u003cheader style=\"background:#C0392B;color:#FFFFFF;border-radius:14px;padding:18px;text-align:center;margin-bottom:15px;\">\u003ch2 style=\"margin:0;font-size:23px;\">🧠❤️ Gestión de las emociones\u003c/h2>\u003cp style=\"margin:8px 0 0;\">¡Aprender a manejar lo que sentimos nos ayuda a vivir mejor!\u003c/p>\u003c/header>\u003csection style=\"margin-bottom:16px;\">\u003ch3 style=\"color:#C0392B;margin-bottom:8px;\">💭 ¿Qué son las emociones?\u003c/h3>\u003cp>Las \u003cstrong>emociones\u003c/strong> son respuestas naturales que sentimos ante diferentes situaciones. Nos ayudan a expresar lo que vivimos y a comprender nuestras necesidades.\u003c/p>\u003cp>\u003cstrong>Todas las emociones son válidas.\u003c/strong> Lo importante es aprender a expresarlas sin lastimarnos ni lastimar a los demás.\u003c/p>\u003c/section>\u003csection style=\"background:#F1F5F9;border-radius:12px;padding:15px;margin-bottom:16px;\">\u003ch3 style=\"color:#34495E;margin:0 0 10px;\">😊 Conoce algunas emociones\u003c/h3>\u003cp>😊 \u003cstrong>Alegría:\u003c/strong> aparece cuando vivimos algo agradable.\u003c/p>\u003cp>😢 \u003cstrong>Tristeza:\u003c/strong> podemos sentirla cuando perdemos algo importante.\u003c/p>\u003cp>😡 \u003cstrong>Enojo:\u003c/strong> surge cuando algo nos molesta o parece injusto.\u003c/p>\u003cp>😨 \u003cstrong>Miedo:\u003c/strong> nos alerta ante posibles peligros.\u003c/p>\u003cp>😲 \u003cstrong>Sorpresa:\u003c/strong> aparece cuando sucede algo inesperado.\u003c/p>\u003cp>😰 \u003cstrong>Ansiedad:\u003c/strong> puede aparecer cuando estamos preocupados por el futuro.\u003c/p>\u003c/section>\u003csection style=\"margin-bottom:16px;\">\u003ch3 style=\"color:#C0392B;\">🌱 ¿Qué significa gestionar las emociones?\u003c/h3>\u003cp>Significa \u003cstrong>reconocer lo que sentimos, comprender por qué lo sentimos y elegir cómo actuar\u003c/strong> de manera responsable.\u003c/p>\u003cp>Por ejemplo, sentir enojo es normal, pero insultar o golpear no es una forma adecuada de expresarlo.\u003c/p>\u003c/section>\u003csection style=\"background:#FFF2EF;border-left:5px solid #C0392B;border-radius:10px;padding:15px;margin-bottom:16px;\">\u003ch3 style=\"color:#C0392B;margin:0 0 10px;\">🛑 Cuatro pasos para manejar tus emociones\u003c/h3>\u003cp>\u003cstrong>1. ✋ DETENTE:\u003c/strong> evita actuar sin pensar.\u003c/p>\u003cp>\u003cstrong>2. 🌬️ RESPIRA:\u003c/strong> respira lentamente para recuperar la calma.\u003c/p>\u003cp>\u003cstrong>3. 💬 IDENTIFICA:\u003c/strong> reconoce y nombra lo que sientes.\u003c/p>\u003cp>\u003cstrong>4. 🤝 ACTÚA:\u003c/strong> elige una respuesta respetuosa y responsable.\u003c/p>\u003c/section>\u003csection style=\"margin-bottom:16px;\">\u003ch3 style=\"color:#34495E;\">🤝 La empatía y el respeto\u003c/h3>\u003cp>La \u003cstrong>empatía\u003c/strong> consiste en intentar comprender cómo se sienten las demás personas.\u003c/p>\u003cp>Podemos demostrar empatía escuchando, respetando las emociones ajenas y ofreciendo apoyo a quienes lo necesitan.\u003c/p>\u003cp>Si una emoción es difícil de manejar, podemos buscar ayuda de familiares, docentes o personas de confianza.\u003c/p>\u003c/section>\u003caside style=\"background:#34495E;color:#FFFFFF;border-radius:12px;padding:16px;text-align:center;\">\u003ch3 style=\"margin:0 0 8px;\">✨ ¡Recuerda!\u003c/h3>\u003cp style=\"margin:0;\">No siempre podemos controlar lo que sentimos, pero podemos aprender a elegir cómo respondemos. ¡Sentir está bien y actuar con respeto es nuestra responsabilidad!\u003c/p>\u003c/aside>\u003c/article>"
