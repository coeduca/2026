      {
        "type": "note",
        "title": "Conozcamos el tema",
        "html": "\u003ch3>El proyecto de vida y el empoderamiento juvenil\u003c/h3>\u003cp>El \u003cstrong>proyecto de vida\u003c/strong> es una herramienta de planificación que nos permite pensar en nuestro futuro, establecer metas y decidir qué acciones debemos realizar para alcanzar nuestros sueños.\u003c/p>\u003cp>Para elaborar un proyecto de vida debemos conocer nuestras habilidades, intereses, valores y capacidades. También necesitamos identificar los obstáculos que podrían dificultar nuestras metas y buscar formas de superarlos.\u003c/p>\u003cp>El \u003cstrong>empoderamiento juvenil\u003c/strong> permite que los jóvenes desarrollen sus capacidades, tengan confianza en sí mismos, tomen decisiones y participen activamente en su comunidad.\u003c/p>\u003cp>La educación, la capacitación, la participación ciudadana y las oportunidades de desarrollo ayudan a los jóvenes a construir un mejor futuro.\u003c/p>"
      },
      {
        "type": "note",
        "title": "Actividad 1. Mi autobiografía",
        "html": "\u003ch3>Actividad individual\u003c/h3>\u003cp>Redacta tu autobiografía tomando en cuenta los siguientes puntos:\u003c/p>\u003col type=\"a\">\u003cli>¿Quién y cómo eres?\u003c/li>\u003cli>¿Quiénes conforman tu familia y quiénes son tus mejores amigos?\u003c/li>\u003cli>¿Cuáles son tus gustos personales y aficiones?\u003c/li>\u003cli>¿Cuáles son tus aspiraciones personales?\u003c/li>\u003c/ol>\u003cp>Escribe dos objetivos personales que deseas cumplir a lo largo de este año y los pasos que debes seguir para alcanzarlos.\u003c/p>\u003cp>\u003cstrong>Reflexiona:\u003c/strong> ¿Consideras importante que cada persona se trace objetivos y metas para el futuro? ¿Por qué?\u003c/p>"
      },
      {
        "type": "note",
        "title": "Actividad 2. Oportunidades para los jóvenes",
        "html": "\u003ch3>Los CUBO como herramientas de desarrollo comunitario\u003c/h3>\u003cp>Los Centros Urbanos de Bienestar y Oportunidades (CUBO) son espacios dentro de las comunidades que permiten promover el desarrollo de la población. En los CUBO, los niños y jóvenes reciben capacitación en diseño gráfico, inglés, italiano, voleibol, lectoescritura, computación, ajedrez, lenguaje de señas salvadoreñas y náhuat.\u003c/p>\u003cp>\u003cstrong>Reflexionen:\u003c/strong>\u003c/p>\u003col type=\"a\">\u003cli>¿De qué manera los CUBO contribuyen al desarrollo de la juventud en El Salvador?\u003c/li>\u003cli>¿Cuáles consideran que son los beneficios de que los niños y los jóvenes reciban capacitación en áreas como diseño gráfico, idiomas, deportes y otras habilidades?\u003c/li>\u003cli>¿Cómo impactan las oportunidades de capacitación y desarrollo en el futuro de los jóvenes?\u003c/li>\u003cli>¿Qué otras iniciativas se podrían promover desde las comunidades y los centros educativos para que la juventud tenga mayores oportunidades de desarrollo?\u003c/li>\u003c/ol>"
      }
    ],
    "deepen": [
      {
        "type": "note",
        "title": "El proyecto de vida",
        "html": "\u003ch3>¿Qué es un proyecto de vida?\u003c/h3>\u003cp>El proyecto de vida es un instrumento de planificación que permite tomar decisiones sobre el futuro y dirigir los esfuerzos hacia el logro de metas relacionadas con nuestros intereses, capacidades, habilidades y recursos.\u003c/p>\u003ch3>Los cinco pasos para crear un proyecto de vida\u003c/h3>\u003col>\u003cli>\u003cstrong>Autoevaluación y autoconocimiento:\u003c/strong> conocer nuestra identidad, valores, intereses, habilidades y limitaciones.\u003c/li>\u003cli>\u003cstrong>Definición de metas:\u003c/strong> establecer objetivos claros, realistas y alcanzables a corto y largo plazo.\u003c/li>\u003cli>\u003cstrong>Plan de acción:\u003c/strong> identificar las acciones y los recursos necesarios para alcanzar cada meta.\u003c/li>\u003cli>\u003cstrong>Ejecución del plan:\u003c/strong> realizar las actividades planificadas en el tiempo establecido.\u003c/li>\u003cli>\u003cstrong>Seguimiento y evaluación:\u003c/strong> revisar los avances y realizar ajustes cuando sea necesario.\u003c/li>\u003c/ol>"
      },
      {
        "type": "note",
        "title": "Personalidad y superación personal",
        "html": "\u003ch3>La personalidad\u003c/h3>\u003cp>La personalidad es el conjunto de rasgos emocionales y conductuales que identifican a una persona y la distinguen de los demás.\u003c/p>\u003cp>Entre sus elementos se encuentran:\u003c/p>\u003cul>\u003cli>\u003cstrong>Temperamento:\u003c/strong> predisposición biológica para responder de determinada manera al entorno.\u003c/li>\u003cli>\u003cstrong>Carácter:\u003c/strong> rasgos relacionados con los valores, las normas y los principios aprendidos.\u003c/li>\u003cli>\u003cstrong>Capacidades cognitivas:\u003c/strong> habilidades relacionadas con el pensamiento, la creatividad y la solución de problemas.\u003c/li>\u003cli>\u003cstrong>Historia de vida:\u003c/strong> experiencias personales y sociales que influyen en nuestra forma de pensar y actuar.\u003c/li>\u003c/ul>\u003ch3>La superación personal\u003c/h3>\u003cp>Es un proceso continuo de crecimiento que busca mejorar la calidad de vida, superar obstáculos, adquirir nuevas habilidades y alcanzar objetivos.\u003c/p>"

      },
      {
        "type": "note",
        "title": "Áreas de superación personal y social",
        "html": "\u003ch3>Las cinco áreas de superación\u003c/h3>\u003cul>\u003cli>\u003cstrong>Vocacional:\u003c/strong> estudios y futuro desempeño laboral.\u003c/li>\u003cli>\u003cstrong>Emocional-conductual:\u003c/strong> desarrollo de habilidades y cualidades personales, como vencer la timidez.\u003c/li>\u003cli>\u003cstrong>Cultural y recreativa:\u003c/strong> actividades artísticas, deportivas y culturales.\u003c/li>\u003cli>\u003cstrong>Afectiva:\u003c/strong> relaciones personales, convivencia y amistades.\u003c/li>\u003cli>\u003cstrong>Sociopolítica:\u003c/strong> valores cívicos, compromiso social y participación ciudadana.\u003c/li>\u003c/ul>\u003cp>Para alcanzar la superación personal se necesitan esfuerzo, tiempo, dedicación, disciplina y perseverancia.\u003c/p>"
      },
      {
        "type": "note",
        "title": "El empoderamiento juvenil",
        "html": "\u003ch3>¿Qué es el empoderamiento?\u003c/h3>\u003cp>Es el proceso mediante el cual las personas adquieren la capacidad de tomar decisiones autónomas y efectivas sobre su vida y su participación en la sociedad.\u003c/p>\u003ch3>Acciones individuales\u003c/h3>\u003cul>\u003cli>Promover la autoestima y la confianza en sí mismo.\u003c/li>\u003cli>Desarrollar nuevas habilidades y conocimientos.\u003c/li>\u003cli>Buscar oportunidades de formación.\u003c/li>\u003c/ul>\u003ch3>Acciones colectivas\u003c/h3>\u003cul>\u003cli>Diseñar espacios de participación juvenil.\u003c/li>\u003cli>Ofrecer oportunidades educativas y de capacitación.\u003c/li>\u003cli>Promover la igualdad de oportunidades.\u003c/li>\u003c/ul>\u003ch3>Espacios de empoderamiento juvenil\u003c/h3>\u003cp>Entre ellos se encuentran los clubes estudiantiles, centros juveniles, organizaciones juveniles y centros de emprendimiento juvenil.\u003c/p>"
