        "html": "<p>Después del Holocausto surgió la necesidad de buscar justicia, responsabilizar a quienes cometieron crímenes y ayudar a las víctimas a reconstruir sus vidas. La <strong>justicia transicional</strong> incluyó juicios, reparaciones, restitución de derechos y acciones para conservar la verdad y la memoria.</p><p>Procesos como los <strong>juicios de Núremberg</strong> ayudaron a establecer responsabilidades y aportaron principios importantes para el derecho internacional. Los testimonios de sobrevivientes, los museos, los monumentos y las conmemoraciones permiten conservar la <strong>memoria colectiva</strong> y enseñar a nuevas generaciones la importancia de proteger los derechos humanos y evitar que hechos semejantes vuelvan a repetirse.</p><p>Lee con atención los documentos y desarrolla las actividades del libro.</p>"
