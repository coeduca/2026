       2. Acceso a la información pública\n                  \u003c/h3>\n                  \u003cp style=\"margin:0;\">\n                    Es el derecho de las personas a solicitar y recibir información sobre las actividades, decisiones y recursos de las instituciones públicas. En El Salvador, este derecho está reconocido en la \u003cstrong>Ley de Acceso a la Información Pública (LAIP)\u003c/strong>.\n                  \u003c/p>\n                \u003c/section>\n\n                \u003csection style=\"background:#F2F7FA;border-radius:12px;padding:15px;margin-bottom:12px;\">\n                  \u003ch3 style=\"font-size:16px;margin:0 0 8px 0;color:#886B14;\">\n                    3. Transparencia institucional\n                  \u003c/h3>\n                  \u003cp style=\"margin:0;\">\n                    Significa que las instituciones públicas permiten conocer sus actuaciones y explican cómo toman decisiones y utilizan los fondos públicos. Esto favorece la confianza ciudadana y ayuda a prevenir la corrupción.\n                  \u003c/p>\n                \u003c/section>\n\n                \u003csection style=\"background:#FFFBE8;border-radius:12px;padding:15px;margin-bottom:12px;\">\n                  \u003ch3 style=\"font-size:16px;margin:0 0 8px 0;color:#886B14;\">\n                    4. Contraloría social\n                  \u003c/h3>\n                  \u003cp style=\"margin:0;\">\n                    Es la participación de la ciudadanía para \u003cstrong>vigilar, evaluar y verificar\u003c/strong> que las autoridades cumplan sus obligaciones y utilicen adecuadamente los recursos públicos.\n                  \u003c/p>\n                \u003c/section>\n\n                \u003csection style=\"border:1px solid #D4AF37;border-radius:12px;padding:15px;margin-top:16px;\">\n                  \u003ch3 style=\"font-size:16px;margin:0 0 8px 0;color:#886B14;\">\n                    ¿Cómo se relacionan estos conceptos?\n                  \u003c/h3>\n                  \u003cp style=\"margin:0;\">\n                    Cuando las personas tienen acceso a la información, pueden participar con mayor conocimiento, supervisar la gestión del Gobierno y exigir transparencia. Así contribuyen al bienestar de toda la comunidad.\n                  \u003c/p>\n                \u003c/section>\n\n                \u003cfooter style=\"margin-top:15px;padding:12px;background:#E8F1F6;border-radius:10px;font-size:13px;\">\n                  \u003cstrong>Idea clave:\u003c/strong> Participar no significa solamente opinar. También implica informarse, actuar responsablemente y colaborar para mejorar la sociedad.\n                \u003c/footer>\n\n              \u003c/section>\n            "
