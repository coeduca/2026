        "html": "<h3>¿Qué fue la República de Weimar?</h3><p>Después de perder la Primera Guerra Mundial, Alemania tuvo que reconstruirse y cambió su forma de gobierno: dejó atrás el Imperio y la monarquía para organizarse como una república.</p><p>La República de Weimar atravesó tres etapas principales. Entre <strong>1919 y 1923</strong> se estableció la nueva república, se realizaron elecciones parlamentarias y se aprobó una constitución, pero hubo gran inestabilidad política y una grave hiperinflación. Entre <strong>1924 y 1929</strong> existió una estabilidad relativa, acompañada de medidas económicas, mayor estabilidad política y un importante desarrollo cultural y artístico. Entre <strong>1929 y 1933</strong>, la crisis económica volvió a provocar desempleo, descontento, tensiones políticas y el crecimiento de movimientos extremistas.</p><p>El <strong>Tratado de Versalles</strong> tuvo un gran impacto: Alemania fue responsabilizada por la guerra, tuvo que pagar reparaciones económicas, perdió territorios y debió limitar su ejército. Estas condiciones generaron sentimientos de humillación y descontento en parte de la población.</p><p>Durante los años de relativa estabilidad también hubo cambios sociales importantes. Las mujeres mayores de veinte años pudieron participar en las elecciones parlamentarias y aumentó la libertad de expresión y la producción cultural. Berlín se convirtió en un importante centro artístico y surgieron espacios como la <strong>Bauhaus</strong>.</p><p>Sin embargo, las tensiones sociales y políticas continuaron. La población judía participaba en diferentes ámbitos de la sociedad alemana, pero también enfrentaba antisemitismo, discriminación y acusaciones promovidas por sectores extremistas. La crisis iniciada en 1929 favoreció el crecimiento de estos grupos y debilitó progresivamente a la República de Weimar.</p>"
