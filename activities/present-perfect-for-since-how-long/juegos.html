      "title": "Grammar Time! Present Perfect",
      "html": "\u003csection style=\"font-family:Arial,sans-serif;color:#1A1A1A;line-height:1.6;max-width:100%;\">\u003cheader style=\"background:#146A5B;color:#FFFFFF;padding:18px;border-radius:15px 15px 5px 5px;text-align:center;\">\u003cdiv style=\"font-size:12px;font-weight:700;letter-spacing:2px;color:#B9F5C7;\">ENGLISH GRAMMAR\u003c/div>\u003ch2 style=\"font-size:24px;line-height:1.2;margin:8px 0;\">Present Perfect\u003c/h2>\u003cp style=\"margin:5px 0;font-size:16px;font-weight:700;\">FOR · SINCE · HOW LONG\u003c/p>\u003c/header>\u003cdiv style=\"padding:15px 5px;\">\u003cp style=\"margin:0 0 12px;\">Usamos el \u003cstrong>Present Perfect\u003c/strong> para hablar de situaciones que comenzaron en el pasado y continúan en el presente.\u003c/p>\u003cdiv style=\"background:#C9DBE9;border-left:5px solid #146A5B;padding:12px;border-radius:8px;margin-bottom:15px;\">\u003cstrong>Structure\u003c/strong>\u003cdiv style=\"font-size:17px;font-weight:700;text-align:center;margin:8px 0;\">Subject + have/has + past participle\u003c/div>\u003cdiv style=\"font-size:13px;text-align:center;\">I / You / We / They → have\u003cbr>He / She / It → has\u003c/div>\u003c/div>\u003cdiv style=\"display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px;\">\u003carticle style=\"flex:1 1 135px;min-width:0;background:#E7F7EB;border:2px solid #43B069;border-radius:12px;padding:12px;\">\u003ch3 style=\"color:#146A5B;margin:0 0 5px;font-size:19px;\">FOR\u003c/h3>\u003cstrong>Duration\u003c/strong>\u003cp style=\"font-size:13px;margin:5px 0;\">Indica cuánto tiempo ha durado una situación.\u003c/p>\u003cp style=\"margin:7px 0 0;font-size:14px;\">\u003cstrong>for two years\u003c/strong>\u003cbr>for three days\u003cbr>for an hour\u003c/p>\u003c/article>\u003carticle style=\"flex:1 1 135px;min-width:0;background:#E8F0F8;border:2px solid #638AB5;border-radius:12px;padding:12px;\">\u003ch3 style=\"color:#146A5B;margin:0 0 5px;font-size:19px;\">SINCE\u003c/h3>\u003cstrong>Starting point\u003c/strong>\u003cp style=\"font-size:13px;margin:5px 0;\">Indica desde cuándo comenzó una situación.\u003c/p>\u003cp style=\"margin:7px 0 0;font-size:14px;\">\u003cstrong>since 2022\u003c/strong>\u003cbr>since Monday\u003cbr>since January\u003c/p>\u003c/article>\u003c/div>\u003carticle style=\"background:#146A5B;color:#FFFFFF;padding:13px;border-radius:12px;margin-bottom:14px;\">\u003ch3 style=\"font-size:19px;margin:0 0 5px;\">HOW LONG...?\u003c/h3>\u003cp style=\"margin:0;font-size:14px;\">Significa \u003cstrong>¿Cuánto tiempo...?\u003c/strong> y sirve para preguntar por la duración.\u003c/p>\u003cp style=\"background:#FFFFFF;color:#146A5B;padding:9px;border-radius:7px;font-weight:700;font-size:14px;margin:10px 0 0;text-align:center;\">How long + have/has + subject + past participle...?\u003c/p>\u003c/article>\u003ch3 style=\"color:#146A5B;margin:12px 0 8px;font-size:18px;\">Examples\u003c/h3>\u003cdiv style=\"background:#F1F6FA;border-radius:10px;padding:12px;font-size:14px;\">\u003cp style=\"margin:0 0 10px;\">\u003cstrong>1. I have studied English for three years.\u003c/strong>\u003cbr>\u003cspan style=\"color:#526273;\">He estudiado inglés durante tres años.\u003c/span>\u003c/p>\u003cp style=\"margin:0 0 10px;\">\u003cstrong>2. She has lived here since 2022.\u003c/strong>\u003cbr>\u003cspan style=\"color:#526273;\">Ella vive aquí desde 2022.\u003c/span>\u003c/p>\u003cp style=\"margin:0;\">\u003cstrong>3. How long have you known your best friend?\u003c/strong>\u003cbr>\u003cspan style=\"color:#526273;\">¿Cuánto tiempo llevas conociendo a tu mejor amigo?\u003c/span>\u003c/p>\u003c/div>\u003cdiv style=\"background:#E7F7EB;border-radius:10px;padding:12px;margin-top:14px;font-size:14px;\">\u003cstrong style=\"color:#146A5B;\">Remember!\u003c/strong>\u003cp style=\"margin:5px 0 0;\">\u003cstrong>FOR\u003c/strong> = duración (two months).\u003cbr>\u003cstrong>SINCE\u003c/strong> = punto de inicio (May).\u003cbr>\u003cstrong>HOW LONG\u003c/strong> = pregunta por el tiempo.\u003c/p>\u003c/div>\u003c/div>\u003c/section>"
