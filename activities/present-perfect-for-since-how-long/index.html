    {
      "type": "note",
      "title": "Grammar Time! Present Perfect",
      "html": "<section style=\"font-family:Arial,sans-serif;color:#1A1A1A;line-height:1.6;max-width:100%;\"><header style=\"background:#146A5B;color:#FFFFFF;padding:18px;border-radius:15px 15px 5px 5px;text-align:center;\"><div style=\"font-size:12px;font-weight:700;letter-spacing:2px;color:#B9F5C7;\">ENGLISH GRAMMAR</div><h2 style=\"font-size:24px;line-height:1.2;margin:8px 0;\">Present Perfect</h2><p style=\"margin:5px 0;font-size:16px;font-weight:700;\">FOR · SINCE · HOW LONG</p></header><div style=\"padding:15px 5px;\"><p style=\"margin:0 0 12px;\">Usamos el <strong>Present Perfect</strong> para hablar de situaciones que comenzaron en el pasado y continúan en el presente.</p><div style=\"background:#C9DBE9;border-left:5px solid #146A5B;padding:12px;border-radius:8px;margin-bottom:15px;\"><strong>Structure</strong><div style=\"font-size:17px;font-weight:700;text-align:center;margin:8px 0;\">Subject + have/has + past participle</div><div style=\"font-size:13px;text-align:center;\">I / You / We / They → have<br>He / She / It → has</div></div><div style=\"display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px;\"><article style=\"flex:1 1 135px;min-width:0;background:#E7F7EB;border:2px solid #43B069;border-radius:12px;padding:12px;\"><h3 style=\"color:#146A5B;margin:0 0 5px;font-size:19px;\">FOR</h3><strong>Duration</strong><p style=\"font-size:13px;margin:5px 0;\">Indica cuánto tiempo ha durado una situación.</p><p style=\"margin:7px 0 0;font-size:14px;\"><strong>for two years</strong><br>for three days<br>for an hour</p></article><article style=\"flex:1 1 135px;min-width:0;background:#E8F0F8;border:2px solid #638AB5;border-radius:12px;padding:12px;\"><h3 style=\"color:#146A5B;margin:0 0 5px;font-size:19px;\">SINCE</h3><strong>Starting point</strong><p style=\"font-size:13px;margin:5px 0;\">Indica desde cuándo comenzó una situación.</p><p style=\"margin:7px 0 0;font-size:14px;\"><strong>since 2022</strong><br>since Monday<br>since January</p></article></div><article style=\"background:#146A5B;color:#FFFFFF;padding:13px;border-radius:12px;margin-bottom:14px;\"><h3 style=\"font-size:19px;margin:0 0 5px;\">HOW LONG...?</h3><p style=\"margin:0;font-size:14px;\">Significa <strong>¿Cuánto tiempo...?</strong> y sirve para preguntar por la duración.</p><p style=\"background:#FFFFFF;color:#146A5B;padding:9px;border-radius:7px;font-weight:700;font-size:14px;margin:10px 0 0;text-align:center;\">How long + have/has + subject + past participle...?</p></article><h3 style=\"color:#146A5B;margin:12px 0 8px;font-size:18px;\">Examples</h3><div style=\"background:#F1F6FA;border-radius:10px;padding:12px;font-size:14px;\"><p style=\"margin:0 0 10px;\"><strong>1. I have studied English for three years.</strong><br><span style=\"color:#526273;\">He estudiado inglés durante tres años.</span></p><p style=\"margin:0 0 10px;\"><strong>2. She has lived here since 2022.</strong><br><span style=\"color:#526273;\">Ella vive aquí desde 2022.</span></p><p style=\"margin:0;\"><strong>3. How long have you known your best friend?</strong><br><span style=\"color:#526273;\">¿Cuánto tiempo llevas conociendo a tu mejor amigo?</span></p></div><div style=\"background:#E7F7EB;border-radius:10px;padding:12px;margin-top:14px;font-size:14px;\"><strong style=\"color:#146A5B;\">Remember!</strong><p style=\"margin:5px 0 0;\"><strong>FOR</strong> = duración (two months).<br><strong>SINCE</strong> = punto de inicio (May).<br><strong>HOW LONG</strong> = pregunta por el tiempo.</p></div></div></section>"
