  <script src="rigo.js"></script>
  <script>window.COEDUCA_FEEDBACK_CONFIG={"id":"2e6cc06a-ed4a-4fcd-9d0a-97a83d9ffa70","kind":"feedback","title":"Tu experiencia con las actividades","level":"2do Año de Bach.","introduction":"Tu opinión nos ayuda a mejorar. Todas las respuestas son válidas: responde con sinceridad.","recipientNies":["4210279","4210254","2724749","6473557","6473562","19724473","6473555","4210255","4210256","5531752","4210268","2295119","5531765","2294851","19769235","19929938","4210277"],"letters":{"4210279":{"greeting":"¡Hola, José!","paragraphs":["Te confieso algo de camaleón a camaleón: yo cambio de color para caerle bien a la gente, y tú lo logras sin cambiar nada. Tu amabilidad y tu carisma se notan desde lejos, y eso no se aprende en ninguna clase.","Quiero reconocer tu gran talento para dibujar y tu creatividad, y sobretodo tu buena forma de ser, espero que la vida te te récompense con sabiduría y mucho éxito.","Lo que más me gustó fue verte, en estos últimos meses, convertido en un estudiante muy dedicado y muy responsable. Siempre te preocupaste por tus tareas, pero ese último tramo tuvo otro nivel de entrega. Yo sé reconocer un buen cambio cuando lo veo, porque el cambio es mi especialidad.","Sé que el fútbol es lo tuyo y que tienes un talento enorme para él. Ojalá algún día puedas seguir estudiando también. No te lo digo para presionarte, solo para que sepas que si la idea vuelve a tocarte la puerta, estudiar y jugar no tienen por qué ser rivales. Hasta los mejores equipos tienen banca para varias cosas a la vez.","Ahora que te gradúas de bachillerato, mi consejo es sencillo: lleva contigo la constancia de estos últimos meses a todo lo que venga. Cuando algo se ponga cuesta arriba, hazlo antes de que se vuelva montaña.","Gracias por el año, por ser como eres. Que nunca cambies tu forma de ser, de verdad. Yo me encargo de cambiar de color por los dos."],"signature":"Con cariño (y con un abrazo de lengua larga), Rigo"},"4210254":{"greeting":"¡Abel, mi querido Abel!","paragraphs":["Tú y yo nos entendemos: los dos tenemos carácter. Yo me pongo rojo del coraje y tú tienes tus propias tonalidades cuando algo te molesta. Pero siempre fuiste un estudiante de confianza, de esos que caen bien aunque a veces echen chispas.","Como camaleón, de esconderme sé un rato largo, así que reconozco el arte de lanzar la piedra y esconder la mano. En mí es camuflaje natural, pero en ti no hace falta. Mi consejo es que des la cara a tiempo. Un «fui yo» dicho a la primera te hace ver más grande, no más pequeño.","Y para esas tareas que a veces se te escapan de la cabeza: anótalas todas, aunque sea en el teléfono, y ponles alarma. Una alarma vale más que mil «ya me acordaré». Si te enojas rápido, respira tres veces antes de contestar. Funciona incluso en camaleones.","Eres buena persona, y eso pesa mucho más que cualquier olvido. Gracias por el año, por la confianza y por los ratos buenos. Que te vaya increíble en lo que sigue."],"signature":"Con cariño, Rigo"},"2724749":{"greeting":"¡Maicol!","paragraphs":["Confieso que esta carta empieza con una presentación: hola, soy Rigo, mucho gusto. Es que tú y yo apenas nos conocemos, jaja. Este año las actividades de Classroom y tú casi no se cruzaron, y yo me quedé esperando en la puerta con mi mejor color.","Pero no te preocupes, que las presentaciones se pueden hacer tarde. Nos veremos en recuperación, y ahí aprovechamos para conocernos mejor, con calma y sin drama.","Mi consejo de camaleón es este: lo que olvidas se queda flotando, y lo que haces se queda hecho. Escribe tus pendientes donde los veas, ponles alarma y hazlos el mismo día. Mañana es un lugar donde las tareas se pierden con mucha facilidad.","Te deseo ánimo para cerrar esta etapa y buena energía para lo que viene. Aquí tienes a un camaleón dispuesto a aplaudirte cuando lo logres."],"signature":"Con cariño, Rigo"},"6473557":{"greeting":"¡Estephany!","paragraphs":["Yo me paso la vida cambiando de color para destacar, y tú destacas con tu propio tono. Responsabilidad y carisma juntas son una combinación que casi nunca se ve, y tú la tienes. Eso, para un camaleón con tantos ojos, no pasa desapercibido.","Tu inteligencia y tus buenos resultados dicen mucho de lo que eres, pero lo que más se queda es que eres de las personas que dejan huella. Eso no se mide con ningún número.","Y no puedo despedirme sin mencionar a Los Chismosos TV, que existen gracias a ti, a Cintia y a Moisés. Si algún día hay segunda temporada, exijo ser el invitado exclusivo, con mi propia silla.","Mi consejo es que no dejes que lo fácil se te vuelva costumbre. A las personas inteligentes lo que las lleva lejos es la curiosidad constante, no solo el talento. Y descansa, que hasta los camaleones necesitamos tomar sol.","Te deseo muchísimo éxito en tus estudios. Gracias por todo el año."],"signature":"Con cariño, Rigo"},"6473562":{"greeting":"¡Amy!","paragraphs":["Voy a ser dramático porque me lo gané: tu actividad de Life Experiences es de las más bonitas que he visto en toda mi vida camaleónica. Y créeme, he visto muchas, desde varios ángulos a la vez.","Tu talento para el dibujo es enorme. Cuando tengo que escoger mi color del día, a veces pienso en tu paleta de colores. Además, tu creatividad nunca estuvo sola: siempre fuiste responsable, y esa mezcla es difícil de encontrar.","Mi consejo es que sigas dibujando, aunque sea en los márgenes del cuaderno. Y que sigas combinando ese talento con la constancia que mostraste este año, porque esa pareja de talentos llega muy lejos.","Gracias por sorprenderme y por hacer que este camaleón se sintiera orgulloso de formar parte de tu año. Ojalá seas así siempre."],"signature":"Con muchísimo cariño y admiración artística, Rigo"},"19724473":{"greeting":"¡Mauricio!","paragraphs":["Un camaleón agradecido te escribe. No cualquiera combina carisma, inteligencia y buen sentido del humor, y tú lo hiciste siempre con responsabilidad. Eres un ejemplo de equilibrio, y yo, que tengo ojos para todos lados, lo vi bien.","Una etapa termina y te gradúas. Ya me imagino al futuro ingeniero agrónomo rodeado de cultivos perfectamente ordenados. Yo estaré escondido entre las hojas, que es mi hábitat natural. Ojalá logres ese sueño, porque se nota que tienes con qué.","Por cierto, dices que no puedes dibujar. Te voy a decir un secreto: los ingenieros hacen planos, y los planos son dibujos con mejor reputación. Estoy seguro de que un día aprenderás, y yo me reservo primera fila para verlo.","Mi consejo es que mantengas tu responsabilidad y tu humor, y que te atrevas a hacer las cosas que no te salen a la primera. Ahí suelen estar las mejores historias.","Gracias por el año y por las risas. Mucho éxito en todo lo que viene."],"signature":"Con cariño, Rigo"},"6473555":{"greeting":"¡Óscar!","paragraphs":["Te voy a contar algo: yo también me distraigo. Si pasa una mosca, mi lengua actúa antes que mi cerebro. Así que no te juzgo por despistado, te entiendo perfectamente.","Pero justamente por eso te doy un consejo de amigo: el teléfono y los videojuegos son geniales, pero a veces se roban el tiempo de cosas más importantes. No te digo que los dejes. Te digo que les pongas horario, como a una serie con capítulos, no como maratón hasta la madrugada.","Creo que tienes potencial, y ojalá se vea reflejado en tus resultados ahora. Organiza tu tiempo con una lista corta, un pendiente a la vez y alarmas que te avisen. Lo difícil no es hacerlo una vez, es hacerlo todos los días, pero se puede.","Gracias por el año, por los momentos buenos y por todo lo que aún puedes lograr. Aquí tienes a un camaleón apostando por ti."],"signature":"Con cariño, Rigo"},"4210255":{"greeting":"¡Estiven!","paragraphs":["Tú ves el mundo como una cancha de fútbol, y eso me encanta: siempre jugando, siempre con energía, siempre listo para meterle ambiente al salón. Yo también juego, aunque mis partidos son de esconderme y aparecer cuando nadie me espera.","Se nota que te preocupas por tus tareas, pero a veces esa preocupación se queda en la banca y no entra a la cancha. Mi consejo: conviértela en jugada. Una tarea hoy, no mañana. Y si nos vemos en recuperación, tómalo como tiempo extra para meter el gol.","Otro consejo de camaleón a goleador: cuida tus palabras. Una mala palabra sale rápido, como un pelotazo, pero no siempre cae donde querías. Te invito a ponerte al día con cualquier pendiente de convivencia que tengas, con la misma energía que le pones al fútbol.","Gracias por el año, por tu alegría y por ser de los que no dejan el salón en silencio. Te deseo mucho éxito en lo que sigue, y que cada vez juegues mejor, dentro y fuera de la cancha."],"signature":"Con cariño, Rigo"},"4210256":{"greeting":"¡Yuleyde!","paragraphs":["Lo primero: que tu carisma nunca cambie. Tienes una forma de contagiar alegría que pocos camaleones logran, y eso que yo me esfuerzo bastante.","Además de simpática, eres muy creativa. Tus dibujos son muy bonitos, de esos que uno quiere mirar dos veces. Si algún día me hacen un retrato oficial, ya sé a quién llamar.","Quieres ser psicóloga, y qué bien. Ojalá lo cumplas, para que nos cures un poquito cuando se nos pase la locura, jaja. Yo seré tu primer paciente y probablemente el más complicado, porque tengo un ego del tamaño de un edificio.","Mi consejo: sigue dibujando y sigue escuchando a la gente como lo haces. Y cuida tu propia alegría, que también necesita descanso.","Gracias por el año. Éxitos y mucha luz en lo que sigue."],"signature":"Con cariño, Rigo"},"5531752":{"greeting":"¡Cintia!","paragraphs":["Gracias por el talento y por la «mala vibra».","Siempre fuiste muy inteligente, y eso te puede llevar muy lejos. Lo mejor es que lo combinas con astucia, creatividad y empoderamiento, que es una mezcla que cualquier camaleón envidiaría. Y no olvido que Los Chismosos TV son lo que son gracias a ti, a Estephany y a Moisés, ya veo que podría verlos en el próximo capitulo de La Rosa de Guadalupe.","Por cierto, creo que de actriz también podrías tener mucho éxito. Si algún día te hacen famosa, quiero una escena como lagartija de fondo.","Mi consejo es simple: sigue tomando buenas decisiones y usa ese empoderamiento para elegir lo que de verdad te hace crecer.","Gracias por el año y por las risas. Mucho éxito en lo que viene."],"signature":"Con cariño (y con mala vibra, pero de la buena), Rigo"},"4210268":{"greeting":"¡Wilmer!","paragraphs":["Wilmer, tenemos que hablar seriamente. Es broma, pero igual quería empezar con plabras fuertes.","Tengo mucha confianza contigo, así que te lo digo con cariño. Sospecho que las tareas se las comió algún camaleón, y juro que no fui yo, aunque no sería la primera vez que me culpan. Probablemente nos veamos en recuperación, y ahí nos ponemos serios, pero serios de verdad.","Mi consejo: anota tus tareas donde las veas, ponles alarma y entrégalas el mismo día. Lo que se hace al momento no se pierde en la mochila ni en la memoria.","Gracias por el año y por la buena onda. Mucha suerte en lo que sigue."],"signature":"Con cariño, Rigo"},"2295119":{"greeting":"¡Hola, Fátima!","paragraphs":["Voy a decirlo sin rodeos: tu espíritu de tranquilidad es una de las cosas más admirables que me he encontrado este año. Yo me pongo nervioso por cualquier mosca, y tú pareces tener una paz que ya quisiera para mí.","Tu madurez se nota en la forma en que te comportas, y tu responsabilidad aún más. Son cualidades que no se aprenden de un día para otro, y tú las tienes bien puestas.","Mi consejo es que cuides esa calma cuando vengan cambios grandes, que los habrá. Y que de vez en cuando te regales un rato de descanso, aunque seas de las que cumplen con todo.","Gracias por el año, por la tranquilidad y por la seriedad con la que llevaste todo. Te deseo mucho éxito en lo que sigue."],"signature":"Con cariño, Rigo"},"5531765":{"greeting":"¡Kevin!","paragraphs":["Esta carta es corta y probablemente nunca la leas: te deseo suerte en lo que sigue. Ojalá en tu próxima etapa te animes a hacer más que calentar la silla del salón de clases."],"signature":"Con cariño, Rigo"},"2294851":{"greeting":"¡Alfredo!","paragraphs":["Llegó la despedida y quería pasar a decirte unas palabras, aunque sea con mi lengua larga y mi mejor color. Gracias por haber sido parte de este año.","Nos veremos en recuperación, y mejor tomarlo con buen ánimo: es una oportunidad más para cerrar esta etapa como se debe, sin prisa y sin drama.","Mi consejo es sencillo: organízate con tiempo, anota lo que tienes pendiente y pide ayuda cuando la necesites. Hasta los camaleones nos apoyamos en las ramas.","Te deseo mucha suerte y mucha energía para lo que viene."],"signature":"Con cariño, Rigo"},"19769235":{"greeting":"¡Ángel!","paragraphs":["Un estudiante responsable e inteligente. Ojalá más gente imitara ese talento y esa responsabilidad, y yo, que tengo ojos para vigilar el salón entero, lo vi desde el principio.","También eres muy creativo, y no puedo olvidar a Los Chismosos TV, que son lo que son gracias a actores como tú. Si algún día regresan, quiero ser el invitado especial, con mi propio personaje secundario.","Mi consejo es que sigas combinando tu creatividad con tu responsabilidad, porque esa mezcla se nota y abre puertas. Y que busques siempre gente con quien hacer cosas tan divertidas como esa.","Gracias por el año y por tu buena energía. Te deseo muchísimo éxito en lo que viene."],"signature":"Con cariño, Rigo"},"19929938":{"greeting":"¡Sophia!","paragraphs":["Siempre creativa, siempre inteligente y siempre responsable: así te voy a recordar. Y eso, para un camaleón que se fija en todos los detalles, es un gran elogio.","Sé que a veces la pereza te gana. Es normal, a mí me pasa cuando hace sol y me quedo pegado a una rama. Pero cuando te pones trabajadora haces cosas realmente impresionantes, y ahí es donde ganas tú.","Mi consejo: cuando sientas que la pereza se asoma, empieza por cinco minutos, solo cinco. Casi siempre, empezar es la parte difícil, y después te llevas tú sola.","Gracias por el año y por todo lo que aportaste. Te deseo lo mejor en lo que sigue, y que sigas sorprendiendo."],"signature":"Con cariño, Rigo"},"4210277":{"greeting":"¡Leo!","paragraphs":["Tienes tanto talento que a veces parece que no necesitas esforzarte para ser de los mejores. Eso es un regalo, y también una trampa. A mí me pasa con el camuflaje: me sale tan fácil que a veces olvido ponerlo a prueba.","Sé que de vez en cuando la pereza hace que los resultados no coincidan con tu inteligencia. No te lo digo para regañarte, sino porque creo que puedes llegar mucho más lejos de lo que ya llegaste.","Mi consejo: elige una meta pequeña por semana y cúmplela, aunque nadie te la pida. Cuando tienes talento, la constancia es lo que lo convierte en algo que todos pueden ver.","Gracias por el año y por tu buena onda. Te deseo mucho éxito en todo lo que viene, y que le des chance a todo ese potencial."],"signature":"Con cariño, Rigo"}},"exercises":[{"type":"feedback","title":"¿Cómo te parecieron las actividades?","dataA":{"id":"experience","type":"choice","required":true,"options":["Me encantaron","Me gustaron","Estuvieron bien","No me gustaron"]}},{"type":"feedback","title":"¿Cómo sentiste la dificultad?","dataA":{"id":"difficulty","type":"choice","required":true,"options":["Muy fáciles","Adecuadas","Difíciles","Muy difíciles"]}},{"type":"feedback","title":"¿Cómo fue tu experiencia con Rigo?","dataA":{"id":"rigo","type":"choice","required":true,"options":["Muy buena","Buena","Regular","Podría mejorar"]}},{"type":"feedback","title":"¿Qué podríamos mejorar?","dataA":{"id":"improve","type":"text","required":true,"options":[]}},{"type":"feedback","title":"¿Quieres dejar un mensaje adicional?","dataA":{"id":"message","type":"text","required":false,"options":[]}}],"deliveryMode":"local"};</script>
