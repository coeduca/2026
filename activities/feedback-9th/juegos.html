<!DOCTYPE html>
<html translate="no" lang="es">
<head>
<meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Centro de juegos · Noveno</title>

  <link rel="icon" href="favicon.webp" type="image/webp">
</head>
<body data-framework="coeduca">
  <main class="gc-shell">
    <header class="gc-hero">
      <div class="gc-hero-top">
        <span class="gc-brand"><span aria-hidden="true">🎮</span> COEDUCA ARCADE</span>
        <div class="gc-hero-actions">
          <button class="gc-info-button" id="gc-info-button" type="button" aria-label="Cómo funciona el Centro de Juegos" aria-haspopup="dialog" title="Cómo funciona el Centro de Juegos">
            <svg viewBox="0 -960 960 960" aria-hidden="true" focusable="false"><path d="M423.5-103.5Q400-127 400-160h160q0 33-23.5 56.5T480-80q-33 0-56.5-23.5ZM320-200v-80h320v80H320Zm10-120q-69-41-109.5-110T180-580q0-125 87.5-212.5T480-880q125 0 212.5 87.5T780-580q0 81-40.5 150T630-320H330Zm24-80h252q45-32 69.5-79T700-580q0-92-64-156t-156-64q-92 0-156 64t-64 156q0 54 24.5 101t69.5 79Zm126 0Z"/></svg>
          </button>
          <a class="gc-back-button" href="index.html" aria-label="Volver a la actividad">
            <svg viewBox="0 -960 960 960" aria-hidden="true" focusable="false"><path d="M400-80 0-480l400-400 71 71-329 329 329 329-71 71Z"/></svg>
            <span>Volver a la actividad</span>
          </a>
        </div>
      </div>
      <div class="gc-hero-content">
        <div class="gc-hero-copy">
          <h1>Centro de <span>juegos</span></h1>
          <p id="gc-project-title"></p>
          <div class="gc-student" id="gc-student" hidden></div>
        </div>
        <div class="gc-hero-art" aria-hidden="true">
          <img class="gc-hero-art-one" src="flappy.webp" alt="">
          <img class="gc-hero-art-two" src="dino-runner.webp" alt="">
          <img class="gc-hero-art-three" src="salto-infinito.webp" alt="">
        </div>
      </div>
    </header>

    <section class="gc-section gc-catalog-section" aria-label="Catálogo de juegos">
      <div class="gc-section-heading gc-section-heading-compact">
        <h2 id="gc-catalog-title" hidden>Catálogo de juegos</h2>
        <span class="gc-count" id="gc-count"></span>
      </div>
      <div class="gc-grid" id="gc-catalog"></div>
    </section>

    <section class="gc-section gc-login" id="gc-login" aria-labelledby="gc-login-title" hidden>
      <h2 id="gc-login-title">Ingresa tu NIE para jugar</h2>
      <p>Así podremos guardar tu puntuación en el ranking de tu grado.</p>
      <form id="gc-login-form">
        <label for="gc-nie">NIE del estudiante</label>
        <div class="gc-login-row">
          <input id="gc-nie" name="nie" type="text" inputmode="numeric" autocomplete="off" required>
          <button type="submit">Continuar</button>
        </div>
      </form>
      <p class="gc-message" id="gc-login-error" role="alert"></p>
    </section>

    <section class="gc-section gc-play" id="gc-play" aria-labelledby="gc-play-title" hidden>
      <div class="gc-section-heading">
        <div>
          <span class="gc-eyebrow">JUEGA Y REVISA TU RANKING</span>
          <h2 id="gc-play-title"></h2>
        </div>
        <div class="gc-play-actions">
          <a class="gc-section-button" href="juegos.html">
            <svg viewBox="0 -960 960 960" aria-hidden="true" focusable="false"><path d="M400-80 0-480l400-400 71 71-329 329 329 329-71 71Z"/></svg>
            <span>Volver al centro de juegos</span>
          </a>
          <div class="gc-sound-slot" id="gc-sound-slot" hidden></div>
        </div>
      </div>
      <p class="gc-message" id="gc-result" aria-live="polite"></p>
      <div id="gc-game"></div>
    </section>
  </main>

  <script src="students.js"></script>
  <script src="coeduca-fixed-auth.js"></script>
  <script src="rigo.js"></script>
  <script src="coeduca-core.js"></script>
  <script src="coeduca-leaderboard.js"></script>
  <script src="coeduca-game-viewport.js"></script>
  <script src="coeduca-hangman-bank.js"></script>
  <script src="matter.min.js"></script>
  <script src="coeduca-games.js"></script>
  <script src="coeduca-flappy.js"></script>
  <script src="coeduca-doodle.js"></script>
  <rigo-mascot></rigo-mascot>

</body>
</html>
