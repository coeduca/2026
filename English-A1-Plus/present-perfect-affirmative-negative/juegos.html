      "title": "Present Perfect: Affirmative & Negative",
      "html": "\u003ch3>¿Qué es el Present Perfect?\u003c/h3>\u003cp>Usamos el \u003cstrong>Present Perfect\u003c/strong> para hablar de experiencias o acciones del pasado que tienen relación con el presente. Se forma con \u003cstrong>have / has + past participle\u003c/strong>.\u003c/p>\u003cp>\u003cstrong>Affirmative:\u003c/strong> Subject + have/has + past participle.\u003c/p>\u003cp>\u003cstrong>Negative:\u003c/strong> Subject + have not/has not + past participle.\u003c/p>\u003ctable>\u003cthead>\u003ctr>\u003cth>Subject\u003c/th>\u003cth>Auxiliary\u003c/th>\u003cth>Past participle\u003c/th>\u003cth>Example\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>I / You / We / They\u003c/td>\u003ctd>have\u003c/td>\u003ctd>eaten\u003c/td>\u003ctd>I have eaten pizza.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>He / She / It\u003c/td>\u003ctd>has\u003c/td>\u003ctd>visited\u003c/td>\u003ctd>She has visited the museum.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>I / You / We / They\u003c/td>\u003ctd>have not\u003c/td>\u003ctd>finished\u003c/td>\u003ctd>They have not finished the homework.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>He / She / It\u003c/td>\u003ctd>has not\u003c/td>\u003ctd>seen\u003c/td>\u003ctd>He has not seen the movie.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>\u003cstrong>Remember:\u003c/strong> Regular verbs usually end in \u003cstrong>-ed\u003c/strong>, while irregular verbs have special participle forms such as \u003cstrong>go → gone\u003c/strong>, \u003cstrong>eat → eaten\u003c/strong> and \u003cstrong>see → seen\u003c/strong>.\u003c/p>"
