      "title": "Present Perfect Questions with 'Ever'",
      "html": "<h3>Have you ever...?</h3><p>Usamos el <strong>Present Perfect</strong> para preguntar sobre experiencias de vida cuando no decimos exactamente cuándo ocurrieron.</p><p>La estructura principal es: <strong>Have/Has + subject + ever + past participle + complement?</strong></p><p><strong>Have you ever visited a volcano?</strong> — ¿Alguna vez has visitado un volcán?</p><p><strong>Has she ever ridden a horse?</strong> — ¿Alguna vez ella ha montado a caballo?</p><p>Usamos <strong>have</strong> con I, you, we y they. Usamos <strong>has</strong> con he, she e it. La palabra <strong>ever</strong> significa «alguna vez» y normalmente aparece antes del participio pasado.</p><p>Para respuestas cortas podemos decir: <strong>Yes, I have.</strong> / <strong>No, I haven't.</strong> / <strong>Yes, she has.</strong> / <strong>No, she hasn't.</strong></p><p>Vocabulario útil de experiencias: visit a volcano, travel by plane, ride a horse, see a horror film, break a bone, win a competition, meet a famous person, sleep in a tent, try unusual food y climb a mountain.</p>"
