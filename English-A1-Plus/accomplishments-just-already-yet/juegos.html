      "type": "note",
      "title": "Learn: Accomplishments & Just / Already / Yet",
      "html": "\n            \u003carticle style=\"color:#1A1A1A;font-family:Arial,sans-serif;line-height:1.6;\">\n\n              \u003cheader style=\"background:#007DFF;color:#FFFFFF;padding:18px;border-radius:14px;margin-bottom:16px;\">\n                \u003ch2 style=\"margin:0 0 6px;font-size:23px;\">My Accomplishments\u003c/h2>\n                \u003cp style=\"margin:0;font-size:14px;opacity:0.95;\">Present Perfect + Just / Already / Yet\u003c/p>\n              \u003c/header>\n\n              \u003csection style=\"margin-bottom:18px;\">\n                \u003ch3 style=\"color:#007DFF;font-size:18px;margin:0 0 8px;\">1. What are accomplishments?\u003c/h3>\n                \u003cp style=\"margin:0 0 10px;\">An \u003cstrong>accomplishment\u003c/strong> is something important or positive that you have achieved through effort, practice, or learning.\u003c/p>\n                \u003cp style=\"margin:0;background:#FFF3DB;padding:12px;border-radius:10px;font-size:14px;\">\n                  \u003cstrong>En español:\u003c/strong> Un logro es algo que has conseguido, como ganar una competencia, aprender una habilidad o terminar un proyecto.\n                \u003c/p>\n              \u003c/section>\n\n              \u003csection style=\"margin-bottom:18px;\">\n                \u003ch3 style=\"color:#007DFF;font-size:18px;margin:0 0 8px;\">2. Present Perfect\u003c/h3>\n                \u003cp style=\"margin:0 0 10px;\">We use the \u003cstrong>Present Perfect\u003c/strong> to talk about experiences, achievements, and actions connected to the present.\u003c/p>\n\n                \u003cdiv style=\"background:#EAF4FF;border-left:4px solid #007DFF;padding:13px;border-radius:8px;text-align:center;margin-bottom:10px;\">\n                  \u003cstrong style=\"color:#0055AE;font-size:15px;\">Subject + have / has + past participle\u003c/strong>\n                \u003c/div>\n\n                \u003cp style=\"margin:0 0 5px;\">\u003cstrong>Have:\u003c/strong> I, You, We, They\u003c/p>\n                \u003cp style=\"margin:0 0 10px;\">\u003cstrong>Has:\u003c/strong> He, She, It\u003c/p>\n\n                \u003cp style=\"margin:0;font-size:13px;color:#444444;\">Common participles: \u003cstrong>finished, learned, won, written, made, built, passed, received.\u003c/strong>\u003c/p>\n              \u003c/section>\n\n              \u003csection style=\"margin-bottom:18px;\">\n                \u003ch3 style=\"color:#007DFF;font-size:18px;margin:0 0 12px;\">3. Just, Already & Yet\u003c/h3>\n\n                \u003cdiv style=\"background:#EAF4FF;border-radius:12px;padding:13px;margin-bottom:10px;border-left:5px solid #007DFF;\">\n                  \u003ch4 style=\"margin:0 0 6px;color:#0055AE;font-size:17px;\">JUST — Acabar de\u003c/h4>\n                  \u003cp style=\"margin:0 0 7px;font-size:14px;\">An action happened a very short time ago.\u003c/p>\n                  \u003cp style=\"margin:0 0 5px;font-weight:bold;\">She has just won a prize.\u003c/p>\n                  \u003cp style=\"margin:0;font-size:13px;color:#555555;\">Ella acaba de ganar un premio.\u003c/p>\n                \u003c/div>\n\n                \u003cdiv style=\"background:#FFF3DB;border-radius:12px;padding:13px;margin-bottom:10px;border-left:5px solid #E6A300;\">\n                  \u003ch4 style=\"margin:0 0 6px;color:#996400;font-size:17px;\">ALREADY — Ya\u003c/h4>\n                  \u003cp style=\"margin:0 0 7px;font-size:14px;\">An action has happened before now, sometimes sooner than expected.\u003c/p>\n                  \u003cp style=\"margin:0 0 5px;font-weight:bold;\">I have already finished my project.\u003c/p>\n                  \u003cp style=\"margin:0;font-size:13px;color:#555555;\">Ya he terminado mi proyecto.\u003c/p>\n                \u003c/div>\n\n                \u003cdiv style=\"background:#F1F2F5;border-radius:12px;padding:13px;border-left:5px solid #777E91;\">\n                  \u003ch4 style=\"margin:0 0 6px;color:#50586E;font-size:17px;\">YET — Ya / Todavía\u003c/h4>\n                  \u003cp style=\"margin:0 0 7px;font-size:14px;\">Usually appears at the end of questions and negative sentences.\u003c/p>\n                  \u003cp style=\"margin:0 0 5px;font-weight:bold;\">Have you finished your homework yet?\u003c/p>\n                  \u003cp style=\"margin:0;font-size:13px;color:#555555;\">¿Ya terminaste tu tarea?\u003c/p>\n                \u003c/div>\n              \u003c/section>\n\n              \u003csection style=\"background:#FFFFFF;border:1px solid #D5E7F8;padding:14px;border-radius:12px;margin-bottom:14px;\">\n                \u003ch3 style=\"color:#007DFF;margin:0 0 10px;font-size:17px;\">Remember the position!\u003c/h3>\n\n                \u003cp style=\"margin:0 0 8px;font-size:14px;\">\n                  \u003cstrong>JUST:\u003c/strong> have / has + just + participle\n                \u003c/p>\n\n                \u003cp style=\"margin:0 0 8px;font-size:14px;\">\n                  \u003cstrong>ALREADY:\u003c/strong> have / has + already + participle\n                \u003c/p>\n\n                \u003cp style=\"margin:0;font-size:14px;\">\n                  \u003cstrong>YET:\u003c/strong> usually at the end of questions and negatives\n                \u003c/p>\n              \u003c/section>\n\n              \u003cfooter style=\"background:#007DFF;color:#FFFFFF;border-radius:10px;padding:12px;text-align:center;font-size:14px;\">\n                \u003cstrong>Think about your achievements!\u003c/strong>\n                \u003cp style=\"margin:4px 0 0;\">What have you accomplished this year?\u003c/p>\n              \u003c/footer>\n\n            \u003c/article>\n          "
