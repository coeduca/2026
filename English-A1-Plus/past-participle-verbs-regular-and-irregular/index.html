      "title": "Past Participles: Regular and Irregular Verbs",
      "html": "<h3>What is a Past Participle?</h3><p>The <strong>past participle</strong> is the third form of a verb, also called <strong>V3</strong>. It is commonly used with <strong>have</strong> or <strong>has</strong> in the Present Perfect.</p><p><strong>Regular verbs</strong> usually form the past participle by adding <strong>-ed</strong>. Example: <em>play → played</em>.</p><p><strong>Irregular verbs</strong> do not follow one fixed rule, so their past participle forms must be learned. Example: <em>go → gone</em>.</p><table><thead><tr><th>Base Verb</th><th>Past Simple</th><th>Past Participle</th><th>Type</th></tr></thead><tbody><tr><td>play</td><td>played</td><td>played</td><td>Regular</td></tr><tr><td>visit</td><td>visited</td><td>visited</td><td>Regular</td></tr><tr><td>clean</td><td>cleaned</td><td>cleaned</td><td>Regular</td></tr><tr><td>go</td><td>went</td><td>gone</td><td>Irregular</td></tr><tr><td>eat</td><td>ate</td><td>eaten</td><td>Irregular</td></tr><tr><td>see</td><td>saw</td><td>seen</td><td>Irregular</td></tr><tr><td>write</td><td>wrote</td><td>written</td><td>Irregular</td></tr><tr><td>do</td><td>did</td><td>done</td><td>Irregular</td></tr></tbody></table><p><strong>Examples:</strong> I have <strong>visited</strong> the museum. / She has <strong>gone</strong> to school. / We have <strong>seen</strong> that movie.</p>"
